<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bindsol.util Settings</title>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1c23 0%, #111318 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e8f0;
            padding: 30px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 400;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 16px;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            transition: all 0.25s ease;
        }

        .back-link:hover {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .settings-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .settings-card h2 {
            font-size: 1.1rem;
            color: #f1f5f9;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-row {
            display: grid;
            grid-template-columns: 220px 1fr 120px;
            gap: 15px;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .app-row:last-child {
            border-bottom: none;
        }

        .app-info {
            display: flex;
            flex-direction: column;
        }

        .app-name {
            font-weight: 600;
            color: #e2e8f0;
            font-size: 0.95rem;
        }

        .app-key {
            font-size: 0.75rem;
            color: #64748b;
            font-family: monospace;
        }

        .input-group {
            position: relative;
        }

        .path-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 10px 14px;
            color: #38bdf8;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .path-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .btn-reset-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-reset-item:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #fca5a5;
        }

        .actions-bar {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn-save {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
            transition: all 0.25s ease;
        }

        .btn-save:hover {
            background: #0369a1;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
            transform: translateY(-1px);
        }

        .btn-reset-all {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-reset-all:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: #022c22;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ Bindsol.util Settings</h1>
            <a href="index.html" class="back-link">← Back to Dashboard</a>
        </div>

        <div class="settings-card">
            <h2>
                <span>Application File & Folder Locations</span>
                <span style="font-size: 0.8rem; font-weight: normal; color: #94a3b8;">Paths are relative to workspace root</span>
            </h2>

            <div id="apps-list">
                <!-- Populated dynamically -->
            </div>

            <div class="actions-bar">
                <button class="btn-reset-all" id="reset-all-btn">Reset All Defaults</button>
                <button class="btn-save" id="save-btn">💾 Save Settings</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Settings Saved Successfully!</div>

    <script>
        const APP_NAMES = {
            "cctv": "📡 CCTV Control Center",
            "videoViewer": "🎞️ Video Viewer",
            "retroTV": "📺 Live Television",
            "mobileSimulator": "📱 Mobile Simulator",
            "animationGallery": "🖼️ Animation Gallery",
            "presentation": "🖼️ Presentation",
            "playingCard": "🎴 Playing Card Viewer",
            "styleMorph": "🎨 Style Morph Animator",
            "stockCall": "📈 Insta BSA-Call",
            "chatStory": "💬 Chat Story Simulator"
        };

        const STORAGE_PREFIX = "bindsol_path_";

        function getDefaultPath(appKey) {
            if (window.BindsolConfig && window.BindsolConfig.apps && window.BindsolConfig.apps[appKey]) {
                const app = window.BindsolConfig.apps[appKey];
                return `${app.parent}/${app.folder}`;
            }
            return "";
        }

        function getSavedPath(appKey) {
            return localStorage.getItem(STORAGE_PREFIX + appKey) || getDefaultPath(appKey);
        }

        function renderAppsList() {
            const listEl = document.getElementById('apps-list');
            listEl.innerHTML = '';

            const apps = window.BindsolConfig ? window.BindsolConfig.apps : {};
            
            for (const appKey in apps) {
                const displayName = APP_NAMES[appKey] || appKey;
                const currentPath = getSavedPath(appKey);
                const defaultPath = getDefaultPath(appKey);

                const row = document.createElement('div');
                row.className = 'app-row';
                row.innerHTML = `
                    <div class="app-info">
                        <span class="app-name">${displayName}</span>
                        <span class="app-key">Key: ${appKey}</span>
                    </div>
                    <div class="input-group">
                        <input type="text" class="path-input" data-app="${appKey}" value="${currentPath}" placeholder="e.g. ${defaultPath}">
                    </div>
                    <div>
                        <button class="btn-reset-item" onclick="resetSingleApp('${appKey}')">Reset</button>
                    </div>
                `;
                listEl.appendChild(row);
            }
        }

        function resetSingleApp(appKey) {
            const defaultPath = getDefaultPath(appKey);
            const input = document.querySelector(`input[data-app="${appKey}"]`);
            if (input) {
                input.value = defaultPath;
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        document.getElementById('save-btn').addEventListener('click', () => {
            const inputs = document.querySelectorAll('.path-input');
            inputs.forEach(input => {
                const appKey = input.getAttribute('data-app');
                const val = input.value.trim().replace(/\/+$/, '');
                if (val) {
                    localStorage.setItem(STORAGE_PREFIX + appKey, val);
                }
            });
            showToast("✓ All settings saved successfully!");
        });

        document.getElementById('reset-all-btn').addEventListener('click', () => {
            const inputs = document.querySelectorAll('.path-input');
            inputs.forEach(input => {
                const appKey = input.getAttribute('data-app');
                localStorage.removeItem(STORAGE_PREFIX + appKey);
            });
            renderAppsList();
            showToast("↺ All paths reset to defaults!");
        });

        document.addEventListener('DOMContentLoaded', renderAppsList);
    </script>
</body>
</html>
