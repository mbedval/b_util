<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bindsol.util Settings</title>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1c23 0%, #111318 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e8f0;
            padding: 30px 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 400;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 16px;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            transition: all 0.25s ease;
        }

        .back-link:hover {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .settings-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }

        .settings-card h2 {
            font-size: 1.1rem;
            color: #f1f5f9;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Toggle Switch Styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 26px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #94a3b8;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
            background-color: #ffffff;
        }

        .app-toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease;
        }

        .app-toggle-row:hover {
            background: rgba(15, 23, 42, 0.7);
        }

        .app-toggles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            margin-left: 8px;
        }
        .status-badge.enabled {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .status-badge.disabled {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .app-row {
            display: grid;
            grid-template-columns: 220px 1fr 120px;
            gap: 15px;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .app-row:last-child {
            border-bottom: none;
        }

        .app-info {
            display: flex;
            flex-direction: column;
        }

        .app-name {
            font-weight: 600;
            color: #e2e8f0;
            font-size: 0.95rem;
        }

        .app-key {
            font-size: 0.75rem;
            color: #64748b;
            font-family: monospace;
        }

        .input-group {
            position: relative;
        }

        .path-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 10px 14px;
            color: #38bdf8;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .path-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .btn-reset-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-reset-item:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #fca5a5;
        }

        .actions-bar {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn-save {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
            transition: all 0.25s ease;
        }

        .btn-save:hover {
            background: #0369a1;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
            transform: translateY(-1px);
        }

        .btn-reset-all {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-reset-all:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: #022c22;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ Bindsol.util Settings</h1>
            <a href="index.html" class="back-link">← Back to Dashboard</a>
        </div>

        <!-- APP VISIBILITY SETTINGS SECTION -->
        <div class="settings-card">
            <h2>
                <span>📱 App Visibility (Enable / Disable Apps on index.html)</span>
                <span style="font-size: 0.8rem; font-weight: normal; color: #94a3b8;">Controls app availability on dashboard</span>
            </h2>
            <div id="app-visibility-grid" class="app-toggles-grid">
                <!-- Populated dynamically -->
            </div>
        </div>

        <!-- PATH CONFIGURATION SECTION -->
        <div class="settings-card">
            <h2>
                <span>📁 Application File & Folder Locations</span>
                <span style="font-size: 0.8rem; font-weight: normal; color: #94a3b8;">Paths are relative to workspace root</span>
            </h2>

            <div id="apps-list">
                <!-- Populated dynamically -->
            </div>

            <div class="actions-bar">
                <button class="btn-reset-all" id="reset-all-btn">Reset All Defaults</button>
                <button class="btn-save" id="save-btn">💾 Save Settings</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Settings Saved Successfully!</div>

    <script>
        const ALL_APPS = {
            "twitter": { name: "🐦 Twitter-X Post", defaultEnabled: true },
            "stockCall": { name: "📈 Insta BSA-Call", defaultEnabled: true },
            "cctv": { name: "📡 CCTV Control Center", defaultEnabled: true },
            "videoViewer": { name: "🎞️ Video Viewer", defaultEnabled: true },
            "animationGallery": { name: "🖼️ Animation Gallery", defaultEnabled: true },
            "presentation": { name: "🖼️ Presentation", defaultEnabled: true },
            "playingCard": { name: "🎴 Playing Card Viewer", defaultEnabled: true },
            "mobileSimulator": { name: "📱 Mobile Simulator", defaultEnabled: true },
            "youtube": { name: "🔴 YouTube", defaultEnabled: true },
            "retroTV": { name: "📺 Live Television", defaultEnabled: true },
            "iptv": { name: "📡 IP TV", defaultEnabled: true },
            "chatStory": { name: "💬 Chat Story Simulator", defaultEnabled: true },
            "styleMorph": { name: "🎨 Style Morph Animator", defaultEnabled: true }
        };

        const STORAGE_PREFIX = "bindsol_path_";
        const ENABLED_PREFIX = "bindsol_app_enabled_";
        let defaultAppConfig = {};

        async function fetchAppConfig() {
            try {
                const res = await fetch('config/app.config.json');
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.apps) {
                        defaultAppConfig = data.apps;
                    }
                }
            } catch (err) {
                console.warn('Could not load config/app.config.json, using defaults:', err);
            }
        }

        function isAppEnabled(appKey) {
            const savedState = localStorage.getItem(ENABLED_PREFIX + appKey);
            if (savedState !== null) {
                return savedState === 'true';
            }
            if (defaultAppConfig[appKey] && typeof defaultAppConfig[appKey].enabled === 'boolean') {
                return defaultAppConfig[appKey].enabled;
            }
            return ALL_APPS[appKey] ? ALL_APPS[appKey].defaultEnabled : true;
        }

        function getDefaultPath(appKey) {
            if (window.BindsolConfig && window.BindsolConfig.apps && window.BindsolConfig.apps[appKey]) {
                const app = window.BindsolConfig.apps[appKey];
                return `${app.parent}/${app.folder}`;
            }
            return "";
        }

        function getSavedPath(appKey) {
            return localStorage.getItem(STORAGE_PREFIX + appKey) || getDefaultPath(appKey);
        }

        function renderVisibilitySection() {
            const gridEl = document.getElementById('app-visibility-grid');
            gridEl.innerHTML = '';

            for (const appKey in ALL_APPS) {
                const appInfo = ALL_APPS[appKey];
                const enabled = isAppEnabled(appKey);

                const row = document.createElement('div');
                row.className = 'app-toggle-row';
                row.innerHTML = `
                    <div class="app-info">
                        <span class="app-name">
                            ${appInfo.name}
                            <span class="status-badge ${enabled ? 'enabled' : 'disabled'}" id="badge-${appKey}">
                                ${enabled ? 'ON' : 'OFF'}
                            </span>
                        </span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" data-app-toggle="${appKey}" ${enabled ? 'checked' : ''} onchange="onToggleChange('${appKey}', this.checked)">
                        <span class="slider"></span>
                    </label>
                `;
                gridEl.appendChild(row);
            }
        }

        function onToggleChange(appKey, isChecked) {
            const badge = document.getElementById(`badge-${appKey}`);
            if (badge) {
                badge.textContent = isChecked ? 'ON' : 'OFF';
                badge.className = `status-badge ${isChecked ? 'enabled' : 'disabled'}`;
            }
        }

        function renderAppsList() {
            const listEl = document.getElementById('apps-list');
            listEl.innerHTML = '';

            const apps = window.BindsolConfig ? window.BindsolConfig.apps : {};
            
            for (const appKey in apps) {
                const appInfo = ALL_APPS[appKey];
                const displayName = appInfo ? appInfo.name : appKey;
                const currentPath = getSavedPath(appKey);
                const defaultPath = getDefaultPath(appKey);

                const row = document.createElement('div');
                row.className = 'app-row';
                row.innerHTML = `
                    <div class="app-info">
                        <span class="app-name">${displayName}</span>
                        <span class="app-key">Key: ${appKey}</span>
                    </div>
                    <div class="input-group">
                        <input type="text" class="path-input" data-app="${appKey}" value="${currentPath}" placeholder="e.g. ${defaultPath}">
                    </div>
                    <div>
                        <button class="btn-reset-item" onclick="resetSingleApp('${appKey}')">Reset</button>
                    </div>
                `;
                listEl.appendChild(row);
            }
        }

        function resetSingleApp(appKey) {
            const defaultPath = getDefaultPath(appKey);
            const input = document.querySelector(`input[data-app="${appKey}"]`);
            if (input) {
                input.value = defaultPath;
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        document.getElementById('save-btn').addEventListener('click', () => {
            // Save paths
            const inputs = document.querySelectorAll('.path-input');
            inputs.forEach(input => {
                const appKey = input.getAttribute('data-app');
                const val = input.value.trim().replace(/\/+$/, '');
                if (val) {
                    localStorage.setItem(STORAGE_PREFIX + appKey, val);
                }
            });

            // Save visibility toggles
            const toggles = document.querySelectorAll('[data-app-toggle]');
            toggles.forEach(toggle => {
                const appKey = toggle.getAttribute('data-app-toggle');
                localStorage.setItem(ENABLED_PREFIX + appKey, toggle.checked ? 'true' : 'false');
            });

            showToast("✓ All settings saved successfully!");
        });

        document.getElementById('reset-all-btn').addEventListener('click', () => {
            const inputs = document.querySelectorAll('.path-input');
            inputs.forEach(input => {
                const appKey = input.getAttribute('data-app');
                localStorage.removeItem(STORAGE_PREFIX + appKey);
            });

            for (const appKey in ALL_APPS) {
                localStorage.removeItem(ENABLED_PREFIX + appKey);
            }

            renderVisibilitySection();
            renderAppsList();
            showToast("↺ All settings & paths reset to defaults!");
        });

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchAppConfig();
            renderVisibilitySection();
            renderAppsList();
        });
    </script>
</body>
</html>
