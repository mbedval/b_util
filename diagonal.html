<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagonal View</title>
    <script src="files.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #3a3a3a 0%, #2a2a2a 50%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .diagonal-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .panel-left {
            clip-path: polygon(0 0, 100% 0, 0 100%);
            z-index: 1;
        }

        .panel-right {
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
            z-index: 2;
        }

        .spiral-binding {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        .spiral-binding::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    135deg,
                    transparent 0px,
                    transparent 8px,
                    #c0c0c0 8px,
                    #808080 10px,
                    #c0c0c0 12px,
                    transparent 12px,
                    transparent 20px
                );
            mask: linear-gradient(135deg, transparent 49.2%, black 49.2%, black 50.8%, transparent 50.8%);
            -webkit-mask: linear-gradient(135deg, transparent 49.2%, black 49.2%, black 50.8%, transparent 50.8%);
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.5));
        }

        .spiral-binding::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    135deg,
                    transparent 0px,
                    transparent 8px,
                    rgba(255, 255, 255, 0.4) 8px,
                    rgba(255, 255, 255, 0.4) 9px,
                    transparent 9px,
                    transparent 20px
                );
            mask: linear-gradient(135deg, transparent 49.4%, black 49.4%, black 50.6%, transparent 50.6%);
            -webkit-mask: linear-gradient(135deg, transparent 49.4%, black 49.4%, black 50.6%, transparent 50.6%);
        }

        .panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .panel:hover img {
            transform: scale(1.05);
        }

        .no-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.5rem;
            text-align: center;
            z-index: 10;
        }

        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            opacity: 0.8;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="diagonal-container">
        <div class="panel panel-left">
            <img id="imageLeft" src="" alt="Left Panel">
        </div>
        <div class="panel panel-right">
            <img id="imageRight" src="" alt="Right Panel">
        </div>
        <div class="spiral-binding"></div>
        <div class="no-content" id="noContent">Add content to wallpapers folder</div>
        <div class="info">Scroll to change images</div>
    </div>

    <script>
        // Supported image formats
        const imageExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp', '.svg'];

        // Pool of all available images
        let imagePool = [];
        let leftIndex = 0;
        let rightIndex = 1;

        // Try to detect additional image files via API
        async function detectAdditionalFiles() {
            try {
                const response = await fetch('/api/files?folder=wallpapers');
                if (response.ok) {
                    const files = await response.json();
                    const newFiles = files.filter(filePath => !imagePool.includes(filePath));
                    if (newFiles.length > 0) {
                        imagePool = [...imagePool, ...newFiles];
                        console.log(`[API] Detected ${newFiles.length} additional files`);
                    }
                }
            } catch (e) {
                console.log('Could not detect additional files via API, relying on files.js fallback');
            }
        }

        // Shuffle array using Fisher-Yates algorithm
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Load images
        function loadImages() {
            if (imagePool.length === 0) {
                document.getElementById('noContent').style.display = 'block';
                return;
            }
            
            document.getElementById('noContent').style.display = 'none';
            
            // Ensure we have at least 2 images
            if (imagePool.length >= 2) {
                document.getElementById('imageLeft').src = imagePool[leftIndex];
                document.getElementById('imageRight').src = imagePool[rightIndex];
            } else if (imagePool.length === 1) {
                // If only 1 image, use it for both panels
                document.getElementById('imageLeft').src = imagePool[0];
                document.getElementById('imageRight').src = imagePool[0];
            }
        }

        // Change images on scroll
        let scrollDelta = 0;
        const scrollThreshold = 100;

        document.addEventListener('wheel', (e) => {
            if (imagePool.length < 2) return;
            
            scrollDelta += Math.abs(e.deltaY);

            if (scrollDelta >= scrollThreshold) {
                // Shuffle and pick new images
                const shuffled = shuffleArray(imagePool);
                document.getElementById('imageLeft').src = shuffled[0];
                document.getElementById('imageRight').src = shuffled[1];
                scrollDelta = 0;
            }
        }, { passive: false });

        // Handle Left/Right arrow key navigation
        document.addEventListener('keydown', (e) => {
            if (imagePool.length < 2) return;
            
            if (e.key === 'ArrowLeft') {
                // Previous pair
                leftIndex = (leftIndex - 2 + imagePool.length) % imagePool.length;
                rightIndex = (leftIndex + 1) % imagePool.length;
                loadImages();
            } else if (e.key === 'ArrowRight') {
                // Next pair
                leftIndex = (leftIndex + 2) % imagePool.length;
                rightIndex = (leftIndex + 1) % imagePool.length;
                loadImages();
            }
        });

        // Async Initialization
        async function init() {
            // 1. Try static list from files.js
            if (window.collageFiles && window.collageFiles.wallpapers) {
                imagePool = [...window.collageFiles.wallpapers];
            }

            // 2. Try API detection
            await detectAdditionalFiles();

            // 3. Fallback to repository defaults if empty
            if (imagePool.length === 0) {
                imagePool = [
                    'wallpapers/tumblr_097efc04a36d9730c3f604e131df2904_0fe9eb8a_2048.jpg',
                    'wallpapers/tumblr_1d8f3a0b0afaedf54068fc57472fc90d_d9b5b757_1280.jpg'
                ];
            }

            // Load initial images
            leftIndex = 0;
            rightIndex = imagePool.length >= 2 ? 1 : 0;
            loadImages();
        }

        // Run initialization
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
