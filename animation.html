<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Animation Gallery</title>
    <script src="config.js"></script>
    <script src="files.js" onerror="console.warn('files.js not found. Using fallback files.')"></script>
    <style>
        :root {
            --bg-color: #0d0e15;
            --panel-bg: rgba(20, 22, 35, 0.85);
            --panel-border: rgba(100, 200, 255, 0.2);
            --accent-color: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.5);
            --text-color: #e0f2fe;
            --text-muted: rgba(224, 242, 254, 0.5);
            --btn-bg: rgba(0, 229, 255, 0.05);
            --btn-hover: rgba(0, 229, 255, 0.2);
        }

        body.theme-neon {
            --accent-color: #ff00ea;
            --accent-glow: rgba(255, 0, 234, 0.6);
            --btn-bg: rgba(255, 0, 234, 0.08);
            --btn-hover: rgba(255, 0, 234, 0.25);
            --panel-border: rgba(255, 0, 234, 0.3);
        }

        body.theme-amber {
            --accent-color: #ffaa00;
            --accent-glow: rgba(255, 170, 0, 0.5);
            --btn-bg: rgba(255, 170, 0, 0.08);
            --btn-hover: rgba(255, 170, 0, 0.25);
            --panel-border: rgba(255, 170, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1a1c2c 0%, #0d0e15 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            overflow: hidden;
            padding: 15px;
        }

        /* Layout Grid Wrapper */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
            text-transform: uppercase;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 15px;
            flex-grow: 1;
            height: calc(100vh - 95px);
        }

        @media (max-width: 992px) {
            .dashboard-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
                height: auto;
                overflow-y: auto;
            }
        }

        /* Grid Viewport */
        .grid-viewport-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .anim-grid {
            display: grid;
            gap: 15px;
            width: 100%;
            height: 100%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .anim-grid.layout-2x2 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
        .anim-grid.layout-3x3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
        .anim-grid.layout-4x4 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
        .anim-grid.layout-masonry {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
        }
        .anim-grid.layout-masonry .anim-monitor:nth-child(1) { grid-column: span 2; grid-row: span 2; }
        .anim-grid.layout-masonry .anim-monitor:nth-child(4) { grid-column: span 2; }

        /* Monitor Box */
        .anim-monitor {
            position: relative;
            background: #000;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .anim-monitor img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.3s ease;
        }

        .anim-monitor:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
            z-index: 5;
        }

        .anim-monitor:hover img {
            transform: scale(1.05);
        }

        /* Fullscreen Focus */
        .anim-monitor.focused {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            z-index: 2000 !important;
            border: none; border-radius: 0; margin: 0;
            cursor: default;
            background: rgba(0,0,0,0.95);
        }
        .anim-monitor.focused img {
            object-fit: contain;
            transform: none !important;
        }

        /* Sidebar */
        .control-sidebar {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .control-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }
        .control-section:last-child { border-bottom: none; }

        .control-section h2 {
            font-size: 0.85rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-group.full { grid-template-columns: 1fr; }

        .control-btn {
            background: var(--btn-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .control-btn:hover {
            background: var(--btn-hover);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .control-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Close Button Overlay */
        .close-button {
            position: fixed;
            top: 25px; right: 35px;
            width: 45px; height: 45px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            color: var(--accent-color);
            font-size: 24px;
            cursor: pointer;
            z-index: 2500;
            display: none;
            align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .close-button:hover { background: var(--accent-color); color: #000; }
        .close-button.visible { display: flex; }

        /* Custom Styles for Frames */
        .style-polaroid .anim-monitor {
            background: white;
            padding: 10px 10px 30px 10px;
            border-radius: 2px;
            border: 1px solid #ddd;
        }
        .style-polaroid .anim-monitor img { border-radius: 2px; }

        .style-neon .anim-monitor {
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow), inset 0 0 10px var(--accent-glow);
        }

        /* Info Overlay */
        .anim-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 15px 10px 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
        }
        .anim-monitor:hover .anim-overlay { opacity: 1; }
        .anim-monitor.focused .anim-overlay { display: none; }

    </style>
</head>
<body>

    <!-- Screen Close Button -->
    <button class="close-button" id="closeButton" title="Exit Full Screen (ESC)">Ã—</button>

    <header style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 14px;">
            <a href="index.html" style="color: var(--accent-color); text-decoration: none; font-weight: bold; font-size: 0.85rem; padding: 6px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--accent-color); border-radius: 6px; transition: all 0.2s ease;">Dashboard</a>
            <h1>Dynamic Animation Gallery</h1>
        </div>
        <div style="font-size: 0.9rem; color: var(--text-muted);" id="counter">0 Frames Loaded</div>
    </header>

    <div class="dashboard-container">
        
        <!-- Grid Viewport -->
        <div class="grid-viewport-card">
            <div class="anim-grid layout-3x3" id="anim-grid">
                <!-- populated dynamically -->
            </div>
        </div>

        <!-- Sidebar Control center -->
        <div class="control-sidebar">
            
            <div class="control-section">
                <h2>Grid Layout</h2>
                <div class="btn-group">
                    <button class="control-btn" data-layout="2x2">2x2 Grid</button>
                    <button class="control-btn active" data-layout="3x3">3x3 Grid</button>
                    <button class="control-btn" data-layout="4x4">4x4 Grid</button>
                    <button class="control-btn" data-layout="masonry">Gallery</button>
                </div>
            </div>

            <div class="control-section">
                <h2>Theme Colors</h2>
                <div class="btn-group">
                    <button class="control-btn active" data-theme="cyan">Cyan</button>
                    <button class="control-btn" data-theme="neon">Neon Pink</button>
                    <button class="control-btn" data-theme="amber">Amber</button>
                </div>
            </div>

            <div class="control-section">
                <h2>Frame Style</h2>
                <div class="btn-group">
                    <button class="control-btn active" data-style="modern">Modern</button>
                    <button class="control-btn" data-style="polaroid">Polaroid</button>
                    <button class="control-btn" data-style="neon">Neon Glow</button>
                </div>
            </div>

            <div class="control-section">
                <h2>Feed Management</h2>
                <div class="btn-group full">
                    <button class="control-btn" id="shuffle-btn">Shuffle Animations</button>
                    <button class="control-btn" id="auto-btn">Auto-Rotate: OFF</button>
                </div>
            </div>

            <div class="control-section" style="flex-grow: 1;">
                <h2>Shortcuts Reference</h2>
                <div style="font-size: 0.75rem; color: var(--text-muted); line-height: 1.8; margin-top: 10px;">
                    [Click] View animation fullscreen<br>
                    [ESC] Exit Fullscreen mode<br>
                    [Space] Force shuffle<br>
                    [Scroll] Shuffle active feeds
                </div>
            </div>

    </div>

    <script>
        const PATH_KEY = 'bindsol_path_animationGallery';
        const defaultPath = (window.BindsolConfig && window.BindsolConfig.apps && window.BindsolConfig.apps.animationGallery)
            ? `${window.BindsolConfig.apps.animationGallery.parent}/${window.BindsolConfig.apps.animationGallery.folder}`
            : 'input/animation';

        function getSavedPath() {
            return localStorage.getItem(PATH_KEY) || defaultPath;
        }

        let imagePool = [];
        const currentPath = getSavedPath();
        const currentFolderKey = currentPath.split('/').pop();

        if (window.collageFiles && Array.isArray(window.collageFiles[currentFolderKey]) && window.collageFiles[currentFolderKey].length > 0) {
            imagePool = window.collageFiles[currentFolderKey];
        } else if (window.collageFiles && Array.isArray(window.collageFiles[window.BindsolConfig.apps.animationGallery.folder]) && window.collageFiles[window.BindsolConfig.apps.animationGallery.folder].length > 0) {
            imagePool = window.collageFiles[window.BindsolConfig.apps.animationGallery.folder];
        }

        async function fetchDynamicFiles() {
            const pathVal = getSavedPath();
            try {
                const res = await fetch(`/api/files/scan?path=${encodeURIComponent(pathVal)}`);
                if (res.ok) {
                    const files = await res.json();
                    if (files && files.length > 0) {
                        const isNew = files.some(f => !imagePool.includes(f));
                        imagePool = files;
                        if (isNew) {
                            buildGrid();
                        }
                    }
                }
            } catch (e) {}
        }

        let activeLayout = '3x3';
        let focusedItem = null;
        let autoRotateTimer = null;
        const grid = document.getElementById('anim-grid');
        const closeBtn = document.getElementById('closeButton');
        let currentImages = [];

        function getLayoutCount(layout) {
            if(layout === '2x2') return 4;
            if(layout === '3x3') return 9;
            if(layout === '4x4') return 16;
            if(layout === 'masonry') return 9;
            return 9;
        }

        function shuffleArray(array) {
            const temp = [...array];
            for (let i = temp.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [temp[i], temp[j]] = [temp[j], temp[i]];
            }
            return temp;
        }

        function buildGrid() {
            grid.innerHTML = '';
            const count = getLayoutCount(activeLayout);
            currentImages = shuffleArray(imagePool).slice(0, count);

            currentImages.forEach((src, i) => {
                const box = document.createElement('div');
                box.className = 'anim-monitor';
                
                const img = document.createElement('img');
                img.src = src;
                
                const overlay = document.createElement('div');
                overlay.className = 'anim-overlay';
                overlay.innerHTML = `<span>Frame ${String(i+1).padStart(2, '0')}</span><span>RAW</span>`;

                box.appendChild(img);
                box.appendChild(overlay);

                box.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if(focusedItem === box) {
                        closeFullscreen();
                    } else {
                        if(focusedItem) closeFullscreen();
                        box.classList.add('focused');
                        focusedItem = box;
                        closeBtn.classList.add('visible');
                    }
                });

                grid.appendChild(box);
            });

            document.getElementById('counter').innerText = `${imagePool.length} Frames Loaded`;
        }

        function closeFullscreen() {
            if(focusedItem) {
                focusedItem.classList.remove('focused');
                focusedItem = null;
                closeBtn.classList.remove('visible');
            }
        }

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeFullscreen();
        });

        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape') closeFullscreen();
            if(e.key === ' ' && !focusedItem) { e.preventDefault(); buildGrid(); }
        });

        let scrollDelta = 0;
        document.addEventListener('wheel', (e) => {
            if(focusedItem) return;
            scrollDelta += Math.abs(e.deltaY);
            if(scrollDelta > 150) {
                buildGrid();
                scrollDelta = 0;
            }
        });

        // Layout Buttons
        document.querySelectorAll('[data-layout]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('[data-layout]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeLayout = btn.dataset.layout;
                grid.className = `anim-grid layout-${activeLayout}`;
                buildGrid();
            });
        });

        // Theme Buttons
        document.querySelectorAll('[data-theme]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-theme]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.body.className = '';
                if(btn.dataset.theme !== 'cyan') {
                    document.body.classList.add(`theme-${btn.dataset.theme}`);
                }
            });
        });

        // Style Buttons
        document.querySelectorAll('[data-style]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-style]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                grid.parentElement.className = 'grid-viewport-card';
                if(btn.dataset.style !== 'modern') {
                    grid.parentElement.classList.add(`style-${btn.dataset.style}`);
                }
            });
        });

        document.getElementById('shuffle-btn').addEventListener('click', buildGrid);

        document.getElementById('auto-btn').addEventListener('click', (e) => {
            const btn = e.target;
            if(autoRotateTimer) {
                clearInterval(autoRotateTimer);
                autoRotateTimer = null;
                btn.innerText = 'Auto-Rotate: OFF';
                btn.classList.remove('active');
            } else {
                autoRotateTimer = setInterval(() => { if(!focusedItem) buildGrid(); }, 5000);
                btn.innerText = 'Auto-Rotate: ON';
                btn.classList.add('active');
            }
        });

        // Init
        buildGrid();
        fetchDynamicFiles();
        setInterval(fetchDynamicFiles, 10000);
    </script>
</body>
</html>
