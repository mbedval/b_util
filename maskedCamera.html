<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Mask Camera Utility | Bindsol Utility</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- MediaPipe Tasks Vision CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js" crossorigin="anonymous"></script>
  
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #1a1e2e 0%, #0d0f17 100%);
      --panel-bg: rgba(22, 27, 43, 0.75);
      --panel-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --radius-lg: 20px;
      --radius-md: 12px;
      --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      box-shadow: var(--shadow-glow);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(90deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
      box-shadow: 0 0 10px #eab308;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.active {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .status-dot.error {
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      flex: 1;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    /* Camera Viewport Container */
    .viewport-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .viewport-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webcamVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror view */
      display: block;
    }

    #outputCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: scaleX(-1); /* Mirror canvas to match video */
    }

    /* Overlay Overlay Elements */
    .viewport-overlay-controls {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .overlay-tag {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e2e8f0;
      pointer-events: auto;
    }

    /* Bottom Quick Action Toolbar inside Stage */
    .viewport-quick-toolbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1.1rem;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .btn-icon.active {
      background: var(--primary);
      box-shadow: 0 0 12px var(--primary);
    }

    .btn-toggle-mask {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-toggle-mask.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: var(--shadow-glow);
    }

    /* Side Control Panel */
    .control-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Filter Carousel / Selection */
    .filter-selector-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .filter-name-display {
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
    }

    .nav-arrow-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .nav-arrow-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .filter-grid::-webkit-scrollbar {
      width: 6px;
    }
    .filter-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .filter-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .filter-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .filter-card.selected {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }

    .filter-icon {
      font-size: 1.8rem;
    }

    .filter-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
    }

    /* Controls Form */
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      justify-content: space-between;
    }

    select, input[type="range"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #fff;
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
    }

    select:focus {
      border-color: var(--primary);
    }

    input[type="range"] {
      padding: 0;
      accent-color: var(--primary);
      height: 6px;
      cursor: pointer;
    }

    /* Action Buttons */
    .btn-action-large {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: all 0.25s ease;
    }

    .btn-action-large:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    /* Modal / Gallery preview of snapshot */
    .snapshot-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .snapshot-modal.open {
      display: flex;
    }

    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .snapshot-img {
      width: 100%;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <a href="index.html" style="color: #fff; text-decoration: none; font-size: 0.85rem; font-weight: 600; padding: 6px 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; margin-right: 12px; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease;">Dashboard</a>
      <div class="brand-icon">🎭</div>
      <div>
        <div class="brand-title">Masked Web Camera Client</div>
        <div style="font-size: 0.75rem; color: var(--text-muted);">Bindsol AI Vision Utility</div>
      </div>
    </div>
    
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Initializing Landmarker...</span>
    </div>
  </header>

  <!-- Main Grid -->
  <main>
    <!-- Viewport Stage -->
    <div class="viewport-card">
      <div class="viewport-stage">
        <video id="webcamVideo" autoplay playsinline muted></video>
        <canvas id="outputCanvas"></canvas>

        <!-- Top overlay tags -->
        <div class="viewport-overlay-controls">
          <div class="overlay-tag" id="currentFilterTag">Filter: Superhero Mask</div>
          <div class="overlay-tag" id="fpsTag">FPS: 0</div>
        </div>

        <!-- Quick Toolbar bottom center -->
        <div class="viewport-quick-toolbar">
          <button class="btn-toggle-mask active" id="btnToggleMask" onclick="toggleMaskState()">
            <span id="toggleMaskIcon">✨</span>
            <span id="toggleMaskLabel">Filter ON</span>
          </button>
          <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.2);"></div>
          <button class="btn-icon" title="Previous Filter" onclick="cycleFilter(-1)">◀</button>
          <button class="btn-icon" title="Next Filter" onclick="cycleFilter(1)">▶</button>
          <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.2);"></div>
          <button class="btn-icon" title="Capture Photo" onclick="takeSnapshot()">📸</button>
        </div>
      </div>
    </div>

    <!-- Side Control Panel -->
    <div class="control-panel">
      <!-- Filter Selector -->
      <div>
        <div class="panel-title">
          <span>Face Filters</span>
          <span id="filterCount">1 / 6</span>
        </div>
        
        <div class="filter-selector-box">
          <div class="filter-nav-header">
            <button class="nav-arrow-btn" onclick="cycleFilter(-1)">◀</button>
            <div class="filter-name-display" id="activeFilterName">Superhero Mask</div>
            <button class="nav-arrow-btn" onclick="cycleFilter(1)">▶</button>
          </div>

          <div class="filter-grid" id="filterGrid">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>

      <!-- Settings -->
      <div class="control-group">
        <div class="panel-title">Camera Source</div>
        <select id="cameraSelect" onchange="switchCamera()"></select>
      </div>

      <div class="control-group">
        <div class="panel-title">Filter Customization</div>
        <div class="control-label">
          <span>Scale</span>
          <span id="opacityVal">40%</span>
        </div>
        <input type="range" id="filterScale" min="10" max="200" value="40" oninput="updateFilterConfig()">

        <div class="control-label" style="margin-top: 10px;">
          <span>Horizontal Offset (X)</span>
          <span id="offsetXVal">0px</span>
        </div>
        <input type="range" id="filterOffsetX" min="-300" max="300" value="0" oninput="updateFilterConfig()">

        <div class="control-label" style="margin-top: 10px;">
          <span>Vertical Offset (Y)</span>
          <span id="offsetYVal">0px</span>
        </div>
        <input type="range" id="filterOffsetY" min="-200" max="200" value="0" oninput="updateFilterConfig()">
      </div>

      <button class="btn-action-large" onclick="takeSnapshot()">
        <span>📸 Capture Photo</span>
      </button>
    </div>
  </main>

  <!-- Snapshot Modal -->
  <div class="snapshot-modal" id="snapshotModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-weight: 700;">Captured Photo</h3>
        <button class="nav-arrow-btn" onclick="closeSnapshotModal()">✕</button>
      </div>
      <img id="snapshotImg" class="snapshot-img" alt="Snapshot">
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeSnapshotModal()">Close</button>
        <a id="downloadSnapshotBtn" class="btn-action-large" style="text-decoration: none; width: auto;" download="masked_camera.png">
          📥 Download Image
        </a>
      </div>
    </div>
  </div>

  <script>
    // Face Filter Definitions
    const FILTERS = [
      {
        id: 'superhero',
        name: 'Venetian Superhero Mask',
        icon: '🦹',
        description: 'Classic sleek upper-face masquerade mask'
      },
      {
        id: 'captain_america',
        name: 'Captain America Cowl',
        icon: '🛡️',
        description: 'Vibranium navy blue helmet with star emblem & wing accents'
      },
      {
        id: 'iron_man',
        name: 'Iron Man Mark L Helmet',
        icon: '🦾',
        description: 'Metallic crimson & gold helmet with glowing arc eyes'
      },
      {
        id: 'spider_man',
        name: 'Spider-Man Web Mask',
        icon: '🕷️',
        description: 'Vibrant red webbed cowl with animated eye blinks'
      },
      {
        id: 'hulk',
        name: 'Incredible Hulk Smash',
        icon: '🟢',
        description: 'Gamma green enraged brow, heavy jaw & radioactive aura'
      },
      {
        id: 'privacy',
        name: 'Privacy Censor Bar',
        icon: '🕶️',
        description: 'Black out eyes for anonymity'
      },
      {
        id: 'cyber',
        name: 'Neon Sci-Fi Visor',
        icon: '⚡',
        description: 'Futuristic luminous glowing visor'
      },
      {
        id: 'pixelate',
        name: 'Face Anonymizer Blur',
        icon: '🧩',
        description: 'Mosaic pixelation across upper facial features'
      },
      {
        id: 'gold_carnival',
        name: 'Golden Venetian Leaf',
        icon: '👑',
        description: 'Ornate gold masquerade crown & eye mask'
      },
      {
        id: 'phantom',
        name: 'Phantom Half-Mask',
        icon: '🎭',
        description: 'Elegant partial half-face porcelain mask'
      }
    ];

    let currentFilterIndex = 0;
    let isMaskActive = true;
    let faceLandmarker = null;
    let webcamRunning = false;
    let videoElement = document.getElementById('webcamVideo');
    let canvasElement = document.getElementById('outputCanvas');
    let canvasCtx = canvasElement.getContext('2d');
    let lastVideoTime = -1;
    let results = null;

    // Performance tracking
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let currentFps = 0;

    // Initialize application
    window.addEventListener('DOMContentLoaded', async () => {
      renderFilterGrid();
      updateFilterConfig();
      await setupMediaPipe();
      await initWebcam();
    });

    // Populate Filter Cards UI
    function renderFilterGrid() {
      const grid = document.getElementById('filterGrid');
      grid.innerHTML = '';

      FILTERS.forEach((filter, idx) => {
        const card = document.createElement('div');
        card.className = `filter-card ${idx === currentFilterIndex ? 'selected' : ''}`;
        card.onclick = () => selectFilter(idx);
        card.innerHTML = `
          <div class="filter-icon">${filter.icon}</div>
          <div class="filter-label">${filter.name}</div>
        `;
        grid.appendChild(card);
      });

      updateFilterHeaderDisplay();
    }

    function selectFilter(idx) {
      currentFilterIndex = idx;
      renderFilterGrid();
    }

    function cycleFilter(direction) {
      currentFilterIndex = (currentFilterIndex + direction + FILTERS.length) % FILTERS.length;
      renderFilterGrid();
    }

    function updateFilterHeaderDisplay() {
      const active = FILTERS[currentFilterIndex];
      document.getElementById('activeFilterName').innerText = active.name;
      document.getElementById('currentFilterTag').innerText = `Filter: ${active.name}`;
      document.getElementById('filterCount').innerText = `${currentFilterIndex + 1} / ${FILTERS.length}`;
    }

    function toggleMaskState() {
      isMaskActive = !isMaskActive;
      const btn = document.getElementById('btnToggleMask');
      const icon = document.getElementById('toggleMaskIcon');
      const label = document.getElementById('toggleMaskLabel');

      if (isMaskActive) {
        btn.classList.add('active');
        icon.innerText = '✨';
        label.innerText = 'Filter ON';
      } else {
        btn.classList.remove('active');
        icon.innerText = '🚫';
        label.innerText = 'Filter OFF';
      }
    }

    // MediaPipe Setup
    async function setupMediaPipe() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      try {
        const { FaceLandmarker, FilesetResolver } = vision;
        const filesetResolver = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        try {
          faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
            baseOptions: {
              modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
              delegate: "GPU"
            },
            outputFaceBlendshapes: false,
            runningMode: "VIDEO",
            numFaces: 1
          });
        } catch (gpuErr) {
          console.warn("GPU delegate failed, attempting CPU delegate fallback...", gpuErr);
          faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
            baseOptions: {
              modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
              delegate: "CPU"
            },
            outputFaceBlendshapes: false,
            runningMode: "VIDEO",
            numFaces: 1
          });
        }

        statusDot.className = 'status-dot active';
        statusText.innerText = 'AI Face Tracking Active';
      } catch (err) {
        console.error("MediaPipe initialization failed:", err);
        statusDot.className = 'status-dot error';
        statusText.innerText = 'Manual Face Positioning Mode';
      }
    }

    // Webcam Setup
    async function initWebcam() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        const cameraSelect = document.getElementById('cameraSelect');

        cameraSelect.innerHTML = '';
        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Camera ${index + 1}`;
          cameraSelect.appendChild(option);
        });

        startCameraStream();
      } catch (err) {
        console.error("Webcam enumerating failed:", err);
      }
    }

    async function startCameraStream(deviceId = null) {
      const constraints = {
        video: deviceId ? { deviceId: { exact: deviceId } } : { width: { ideal: 1280 }, height: { ideal: 720 } }
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = stream;
        videoElement.onloadedmetadata = () => {
          videoElement.play();
          webcamRunning = true;
          resizeCanvas();
          requestAnimationFrame(renderLoop);
        };
      } catch (err) {
        console.error("Camera access error:", err);
        document.getElementById('statusText').innerText = 'Camera Access Denied';
        document.getElementById('statusDot').className = 'status-dot error';
      }
    }

    function switchCamera() {
      const select = document.getElementById('cameraSelect');
      startCameraStream(select.value);
    }

    function resizeCanvas() {
      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 480;
    }

    // Main Render Animation Loop
    async function renderLoop() {
      if (!webcamRunning) return;

      // Track FPS
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        currentFps = Math.round((frameCount * 1000) / (now - lastFpsTime));
        document.getElementById('fpsTag').innerText = `FPS: ${currentFps}`;
        frameCount = 0;
        lastFpsTime = now;
      }

      if (videoElement.currentTime !== lastVideoTime) {
        lastVideoTime = videoElement.currentTime;
        if (faceLandmarker) {
          results = faceLandmarker.detectForVideo(videoElement, now);
        }
      }

      // Clear Canvas
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Render Active Filter if ON
      if (isMaskActive) {
        if (results && results.faceLandmarks && results.faceLandmarks.length > 0) {
          renderAiFaceFilter(results.faceLandmarks[0]);
        } else {
          renderFallbackFaceFilter();
        }

        // Draw themed camera border frame to complement active filter
        drawFilterBorderFrame(FILTERS[currentFilterIndex].id, canvasElement.width, canvasElement.height);
      }

      requestAnimationFrame(renderLoop);
    }

    // Get current filter configuration offsets
    function getFilterConfig() {
      const scale = parseFloat(document.getElementById('filterScale').value) / 100;
      const offsetX = parseFloat(document.getElementById('filterOffsetX').value);
      const offsetY = parseFloat(document.getElementById('filterOffsetY').value);
      return { scale, offsetX, offsetY };
    }

    function updateFilterConfig() {
      document.getElementById('opacityVal').innerText = `${document.getElementById('filterScale').value}%`;
      document.getElementById('offsetXVal').innerText = `${document.getElementById('filterOffsetX').value}px`;
      document.getElementById('offsetYVal').innerText = `${document.getElementById('filterOffsetY').value}px`;
    }

    // AI Landmark Based Mask Render Engine
    function renderAiFaceFilter(landmarks) {
      const config = getFilterConfig();
      const current = FILTERS[currentFilterIndex];

      // Key Facial Landmarks Indices from MediaPipe 468 mesh:
      // Left eye outer: 33, Right eye outer: 263, Nose tip: 1, Chin bottom: 152, Forehead top: 10
      const leftEye = landmarks[33];
      const rightEye = landmarks[263];
      const noseTip = landmarks[1];
      const forehead = landmarks[10];

      const w = canvasElement.width;
      const h = canvasElement.height;

      const pLeft = { x: leftEye.x * w, y: leftEye.y * h };
      const pRight = { x: rightEye.x * w, y: rightEye.y * h };
      const pNose = { x: noseTip.x * w, y: noseTip.y * h };

      // Calculate Eye Distance and Angle
      const eyeDx = pRight.x - pLeft.x;
      const eyeDy = pRight.y - pLeft.y;
      const eyeDist = Math.hypot(eyeDx, eyeDy);
      const eyeAngle = Math.atan2(eyeDy, eyeDx);

      // Center point between eyes
      const eyeCenterX = (pLeft.x + pRight.x) / 2 + config.offsetX;
      const eyeCenterY = (pLeft.y + pRight.y) / 2 + config.offsetY;

      // Real-time user eye blink detection using upper/lower eyelid landmarks
      let leftBlinkFactor = 1.0;
      let rightBlinkFactor = 1.0;
      if (landmarks[159] && landmarks[145] && landmarks[386] && landmarks[374]) {
        const leftH = Math.hypot((landmarks[159].x - landmarks[145].x) * w, (landmarks[159].y - landmarks[145].y) * h);
        const rightH = Math.hypot((landmarks[386].x - landmarks[374].x) * w, (landmarks[386].y - landmarks[374].y) * h);
        const normH = eyeDist * 0.22;
        leftBlinkFactor = Math.max(0.12, Math.min(1.0, leftH / normH));
        rightBlinkFactor = Math.max(0.12, Math.min(1.0, rightH / normH));
      }

      // Periodic superhero auto-blink cycle (blinks every ~3.2 seconds)
      const nowSec = performance.now() / 1000;
      const blinkCycle = nowSec % 3.2;
      let autoBlinkFactor = 1.0;
      if (blinkCycle < 0.22) {
        autoBlinkFactor = 0.15 + 0.85 * Math.abs(Math.sin((blinkCycle / 0.22) * Math.PI));
      }

      const finalLeftBlink = Math.min(leftBlinkFactor, autoBlinkFactor);
      const finalRightBlink = Math.min(rightBlinkFactor, autoBlinkFactor);

      // Dynamic facial oval aspect scaling based on real face mesh landmarks (cheekbones 234/454 and forehead/chin 10/152)
      let scaleX = config.scale;
      let scaleY = config.scale;
      if (landmarks[234] && landmarks[454] && landmarks[10] && landmarks[152]) {
        const faceW = Math.hypot((landmarks[454].x - landmarks[234].x) * w, (landmarks[454].y - landmarks[234].y) * h);
        const faceH = Math.hypot((landmarks[152].x - landmarks[10].x) * w, (landmarks[152].y - landmarks[10].y) * h);
        if (eyeDist > 0) {
          const normW = eyeDist * 2.3;
          const normH = eyeDist * 2.7;
          scaleX *= Math.max(0.8, Math.min(1.35, faceW / normW));
          scaleY *= Math.max(0.8, Math.min(1.35, faceH / normH));
        }
      }

      canvasCtx.save();
      canvasCtx.translate(eyeCenterX, eyeCenterY);
      canvasCtx.rotate(eyeAngle);
      canvasCtx.scale(scaleX, scaleY);

      switch (current.id) {
        case 'superhero':
          drawSuperheroMask(eyeDist);
          break;
        case 'captain_america':
          drawCaptainAmericaMask(eyeDist);
          break;
        case 'iron_man':
          drawIronManMask(eyeDist);
          break;
        case 'spider_man':
          drawSpiderManMask(eyeDist, finalLeftBlink, finalRightBlink);
          break;
        case 'hulk':
          drawHulkMask(eyeDist);
          break;
        case 'privacy':
          drawPrivacyCensorBar(eyeDist);
          break;
        case 'cyber':
          drawCyberVisor(eyeDist);
          break;
        case 'pixelate':
          drawPixelatedAnonymizer(eyeCenterX, eyeCenterY, eyeDist);
          break;
        case 'gold_carnival':
          drawGoldVenetianLeaf(eyeDist);
          break;
        case 'phantom':
          drawPhantomMask(eyeDist);
          break;
      }

      canvasCtx.restore();
    }

    // Fallback Manual Mask Render when AI Landmarks are loading or undetected
    function renderFallbackFaceFilter() {
      const config = getFilterConfig();
      const current = FILTERS[currentFilterIndex];

      const centerX = canvasElement.width / 2 + config.offsetX;
      const centerY = canvasElement.height / 2.3 + config.offsetY;
      const eyeDist = canvasElement.width * 0.22;

      // Periodic hero auto-blink for fallback mode
      const nowSec = performance.now() / 1000;
      const blinkCycle = nowSec % 3.2;
      let autoBlinkFactor = 1.0;
      if (blinkCycle < 0.22) {
        autoBlinkFactor = 0.15 + 0.85 * Math.abs(Math.sin((blinkCycle / 0.22) * Math.PI));
      }

      canvasCtx.save();
      canvasCtx.translate(centerX, centerY);
      canvasCtx.scale(config.scale, config.scale);

      switch (current.id) {
        case 'superhero':
          drawSuperheroMask(eyeDist);
          break;
        case 'captain_america':
          drawCaptainAmericaMask(eyeDist);
          break;
        case 'iron_man':
          drawIronManMask(eyeDist);
          break;
        case 'spider_man':
          drawSpiderManMask(eyeDist, autoBlinkFactor, autoBlinkFactor);
          break;
        case 'hulk':
          drawHulkMask(eyeDist);
          break;
        case 'privacy':
          drawPrivacyCensorBar(eyeDist);
          break;
        case 'cyber':
          drawCyberVisor(eyeDist);
          break;
        case 'gold_carnival':
          drawGoldVenetianLeaf(eyeDist);
          break;
        case 'phantom':
          drawPhantomMask(eyeDist);
          break;
      }

      canvasCtx.restore();
    }

    // Mask Rendering Primitives
    function drawCaptainAmericaMask(eyeDist) {
      const mw = eyeDist * 2.6;
      const mh = eyeDist * 1.8;

      canvasCtx.save();

      // Metallic Navy Blue Cowl Helmet Base
      const blueGrad = canvasCtx.createLinearGradient(-mw / 2, -mh / 2, mw / 2, mh / 2);
      blueGrad.addColorStop(0, '#1e3a8a');
      blueGrad.addColorStop(0.4, '#2563eb');
      blueGrad.addColorStop(0.8, '#1d4ed8');
      blueGrad.addColorStop(1, '#0f172a');

      canvasCtx.fillStyle = blueGrad;
      canvasCtx.strokeStyle = '#1e40af';
      canvasCtx.lineWidth = 3;
      canvasCtx.shadowColor = 'rgba(37, 99, 235, 0.4)';
      canvasCtx.shadowBlur = 15;

      // Metallic Navy Blue Cowl Helmet Base (Smooth Facial Oval Contour)
      canvasCtx.beginPath();
      canvasCtx.ellipse(0, -mh * 0.05, mw * 0.48, mh * 0.52, 0, 0, Math.PI * 2);
      canvasCtx.fill();
      canvasCtx.stroke();

      // Forehead "A" Stencil Emblem
      canvasCtx.fillStyle = '#ffffff';
      canvasCtx.strokeStyle = '#cbd5e1';
      canvasCtx.lineWidth = 2;
      canvasCtx.shadowColor = '#ffffff';
      canvasCtx.shadowBlur = 10;

      canvasCtx.font = `bold ${Math.round(mh * 0.38)}px sans-serif`;
      canvasCtx.textAlign = 'center';
      canvasCtx.textBaseline = 'middle';
      canvasCtx.fillText('A', 0, -mh * 0.26);

      // Side Silver Wing Accents (Left & Right)
      const drawWing = (isRight) => {
        const dir = isRight ? 1 : -1;
        canvasCtx.save();
        canvasCtx.translate(dir * mw * 0.38, -mh * 0.18);
        canvasCtx.scale(dir, 1);

        const wingGrad = canvasCtx.createLinearGradient(0, 0, eyeDist * 0.3, 0);
        wingGrad.addColorStop(0, '#ffffff');
        wingGrad.addColorStop(1, '#94a3b8');

        canvasCtx.fillStyle = wingGrad;
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, 0);
        canvasCtx.quadraticCurveTo(eyeDist * 0.25, -mh * 0.15, eyeDist * 0.35, -mh * 0.05);
        canvasCtx.quadraticCurveTo(eyeDist * 0.2, mh * 0.05, 0, mh * 0.1);
        canvasCtx.closePath();
        canvasCtx.fill();

        canvasCtx.restore();
      };

      drawWing(false);
      drawWing(true);

      // Eye Cutouts
      canvasCtx.globalCompositeOperation = 'destination-out';
      canvasCtx.beginPath();
      canvasCtx.ellipse(-eyeDist * 0.45, 0, eyeDist * 0.26, eyeDist * 0.17, -0.1, 0, Math.PI * 2);
      canvasCtx.fill();

      canvasCtx.beginPath();
      canvasCtx.ellipse(eyeDist * 0.45, 0, eyeDist * 0.26, eyeDist * 0.17, 0.1, 0, Math.PI * 2);
      canvasCtx.fill();

      canvasCtx.globalCompositeOperation = 'source-over';
      canvasCtx.restore();
    }

    function drawHulkMask(eyeDist) {
      const mw = eyeDist * 2.7;
      const mh = eyeDist * 1.9;

      canvasCtx.save();

      // Gamma Green Angry Brow Ridge
      const greenGrad = canvasCtx.createLinearGradient(0, -mh / 2, 0, mh / 2);
      greenGrad.addColorStop(0, '#166534');
      greenGrad.addColorStop(0.4, '#22c55e');
      greenGrad.addColorStop(0.8, '#15803d');
      greenGrad.addColorStop(1, '#14532d');

      canvasCtx.fillStyle = greenGrad;
      canvasCtx.strokeStyle = '#14532d';
      canvasCtx.lineWidth = 3.5;
      canvasCtx.shadowColor = 'rgba(34, 197, 94, 0.6)';
      canvasCtx.shadowBlur = 18;

      // Gamma Green Angry Brow Ridge (Smooth Facial Oval Contour)
      canvasCtx.beginPath();
      canvasCtx.ellipse(0, -mh * 0.04, mw * 0.49, mh * 0.52, 0, 0, Math.PI * 2);
      canvasCtx.fill();
      canvasCtx.stroke();

      // Furrowed Angry Brow Creases
      canvasCtx.strokeStyle = '#052e16';
      canvasCtx.lineWidth = 3;
      canvasCtx.beginPath();
      canvasCtx.moveTo(-mw * 0.1, -mh * 0.2);
      canvasCtx.lineTo(0, -mh * 0.05);
      canvasCtx.lineTo(mw * 0.1, -mh * 0.2);
      canvasCtx.moveTo(-mw * 0.4, -mh * 0.22);
      canvasCtx.quadraticCurveTo(-mw * 0.2, -mh * 0.28, 0, -mh * 0.12);
      canvasCtx.quadraticCurveTo(mw * 0.2, -mh * 0.28, mw * 0.4, -mh * 0.22);
      canvasCtx.stroke();

      // Jagged Dark Hulk Hair Spikes across top
      canvasCtx.fillStyle = '#0f172a';
      canvasCtx.shadowColor = '#000000';
      canvasCtx.shadowBlur = 8;
      canvasCtx.beginPath();
      canvasCtx.moveTo(-mw * 0.45, -mh * 0.35);
      const spikes = 9;
      for (let i = 0; i <= spikes; i++) {
        const x = -mw * 0.45 + (i * mw * 0.9) / spikes;
        const spikeY = -mh * (0.45 + (i % 2 === 0 ? 0.18 : 0.08));
        canvasCtx.lineTo(x, spikeY);
      }
      canvasCtx.lineTo(mw * 0.45, -mh * 0.35);
      canvasCtx.closePath();
      canvasCtx.fill();

      // Eye Cutouts
      canvasCtx.globalCompositeOperation = 'destination-out';
      canvasCtx.beginPath();
      canvasCtx.ellipse(-eyeDist * 0.45, 0, eyeDist * 0.25, eyeDist * 0.16, -0.15, 0, Math.PI * 2);
      canvasCtx.fill();

      canvasCtx.beginPath();
      canvasCtx.ellipse(eyeDist * 0.45, 0, eyeDist * 0.25, eyeDist * 0.16, 0.15, 0, Math.PI * 2);
      canvasCtx.fill();

      canvasCtx.globalCompositeOperation = 'source-over';

      // Enraged Green Eye Aura Outline
      canvasCtx.strokeStyle = '#4ade80';
      canvasCtx.lineWidth = 2;
      canvasCtx.shadowColor = '#22c55e';
      canvasCtx.shadowBlur = 12;
      canvasCtx.beginPath();
      canvasCtx.ellipse(-eyeDist * 0.45, 0, eyeDist * 0.27, eyeDist * 0.18, -0.15, 0, Math.PI * 2);
      canvasCtx.stroke();
      canvasCtx.beginPath();
      canvasCtx.ellipse(eyeDist * 0.45, 0, eyeDist * 0.27, eyeDist * 0.18, 0.15, 0, Math.PI * 2);
      canvasCtx.stroke();

      canvasCtx.restore();
    }

    // Camera Viewport Theme Border Frame Renderer
    function drawFilterBorderFrame(filterId, w, h) {
      canvasCtx.save();

      switch (filterId) {
        case 'captain_america':
          // Vibranium Shield Border Frame
          canvasCtx.lineWidth = 12;
          canvasCtx.strokeStyle = '#dc2626'; // Red outer ring
          canvasCtx.strokeRect(6, 6, w - 12, h - 12);

          canvasCtx.lineWidth = 6;
          canvasCtx.strokeStyle = '#f8fafc'; // Silver middle ring
          canvasCtx.strokeRect(15, 15, w - 30, h - 30);

          canvasCtx.lineWidth = 6;
          canvasCtx.strokeStyle = '#1e3a8a'; // Navy inner ring
          canvasCtx.strokeRect(21, 21, w - 42, h - 42);

          // 4 Corner Stars
          canvasCtx.fillStyle = '#ffffff';
          canvasCtx.shadowColor = '#ffffff';
          canvasCtx.shadowBlur = 10;
          canvasCtx.font = '22px sans-serif';
          canvasCtx.fillText('★', 32, 44);
          canvasCtx.fillText('★', w - 46, 44);
          canvasCtx.fillText('★', 32, h - 28);
          canvasCtx.fillText('★', w - 46, h - 28);
          break;

        case 'hulk':
          // Gamma Radiation Toxic Border Frame
          canvasCtx.lineWidth = 10;
          canvasCtx.strokeStyle = '#22c55e';
          canvasCtx.shadowColor = '#4ade80';
          canvasCtx.shadowBlur = 20;
          canvasCtx.strokeRect(10, 10, w - 20, h - 20);

          // Gamma Corner Hazard Chevrons
          canvasCtx.fillStyle = '#15803d';
          const size = 45;
          canvasCtx.fillRect(15, 15, size, 8);
          canvasCtx.fillRect(15, 15, 8, size);
          canvasCtx.fillRect(w - 15 - size, 15, size, 8);
          canvasCtx.fillRect(w - 23, 15, 8, size);
          canvasCtx.fillRect(15, h - 23, size, 8);
          canvasCtx.fillRect(15, h - 15 - size, 8, size);
          canvasCtx.fillRect(w - 15 - size, h - 23, size, 8);
          canvasCtx.fillRect(w - 23, h - 15 - size, 8, size);
          break;

        case 'spider_man':
          // Spider Web Corner Frames
          canvasCtx.strokeStyle = '#ef4444';
          canvasCtx.lineWidth = 2.5;
          canvasCtx.shadowColor = '#dc2626';
          canvasCtx.shadowBlur = 10;

          const drawCornerWeb = (cx, cy, dirX, dirY) => {
            const webRad = 70;
            const lines = 4;
            for (let i = 0; i <= lines; i++) {
              const angle = (i * (Math.PI / 2)) / lines;
              canvasCtx.beginPath();
              canvasCtx.moveTo(cx, cy);
              canvasCtx.lineTo(cx + dirX * Math.cos(angle) * webRad, cy + dirY * Math.sin(angle) * webRad);
              canvasCtx.stroke();
            }
            [25, 50, 70].forEach(r => {
              canvasCtx.beginPath();
              canvasCtx.arc(cx, cy, r, 0, Math.PI / 2);
              canvasCtx.stroke();
            });
          };

          drawCornerWeb(0, 0, 1, 1);
          drawCornerWeb(w, 0, -1, 1);
          drawCornerWeb(0, h, 1, -1);
          drawCornerWeb(w, h, -1, -1);

          canvasCtx.strokeStyle = 'rgba(239, 68, 68, 0.8)';
          canvasCtx.lineWidth = 4;
          canvasCtx.strokeRect(6, 6, w - 12, h - 12);
          break;

        case 'iron_man':
          // Stark Tech HUD Camera Frame
          canvasCtx.strokeStyle = '#00f0ff';
          canvasCtx.lineWidth = 2;
          canvasCtx.shadowColor = '#00f0ff';
          canvasCtx.shadowBlur = 12;
          canvasCtx.strokeRect(15, 15, w - 30, h - 30);

          // Gold/Red Tech Corner Bracket Overlays
          canvasCtx.strokeStyle = '#fbbf24';
          canvasCtx.lineWidth = 4;
          const bracketLen = 40;
          // TL
          canvasCtx.beginPath(); canvasCtx.moveTo(15, 15 + bracketLen); canvasCtx.lineTo(15, 15); canvasCtx.lineTo(15 + bracketLen, 15); canvasCtx.stroke();
          // TR
          canvasCtx.beginPath(); canvasCtx.moveTo(w - 15 - bracketLen, 15); canvasCtx.lineTo(w - 15, 15); canvasCtx.lineTo(w - 15, 15 + bracketLen); canvasCtx.stroke();
          // BL
          canvasCtx.beginPath(); canvasCtx.moveTo(15, h - 15 - bracketLen); canvasCtx.lineTo(15, h - 15); canvasCtx.lineTo(15 + bracketLen, h - 15); canvasCtx.stroke();
          // BR
          canvasCtx.beginPath(); canvasCtx.moveTo(w - 15 - bracketLen, h - 15); canvasCtx.lineTo(w - 15, h - 15); canvasCtx.lineTo(w - 15, h - 15 - bracketLen); canvasCtx.stroke();

          // STARK HUD Reticle Text
          canvasCtx.font = '12px monospace';
          canvasCtx.fillStyle = '#00f0ff';
          canvasCtx.fillText('SYS.LOC // STARK_HUD_ONLINE', 25, 32);
          canvasCtx.fillText('MARK L [TARGET_LOCK]', w - 180, 32);
          break;

        case 'cyber':
          canvasCtx.strokeStyle = '#ec4899';
          canvasCtx.lineWidth = 3;
          canvasCtx.shadowColor = '#06b6d4';
          canvasCtx.shadowBlur = 15;
          canvasCtx.strokeRect(10, 10, w - 20, h - 20);
          break;

        case 'privacy':
          // Hazard Stripes Top & Bottom
          const stripeW = 20;
          canvasCtx.fillStyle = '#eab308';
          canvasCtx.fillRect(0, 0, w, 12);
          canvasCtx.fillRect(0, h - 12, w, 12);
          canvasCtx.fillStyle = '#000000';
          for (let x = 0; x < w; x += stripeW * 2) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(x, 0); canvasCtx.lineTo(x + stripeW, 0); canvasCtx.lineTo(x, 12);
            canvasCtx.closePath(); canvasCtx.fill();
            canvasCtx.beginPath();
            canvasCtx.moveTo(x, h - 12); canvasCtx.lineTo(x + stripeW, h - 12); canvasCtx.lineTo(x, h);
            canvasCtx.closePath(); canvasCtx.fill();
          }
          break;

        case 'gold_carnival':
          canvasCtx.strokeStyle = '#fbbf24';
          canvasCtx.lineWidth = 5;
          canvasCtx.shadowColor = '#f59e0b';
          canvasCtx.shadowBlur = 12;
          canvasCtx.strokeRect(12, 12, w - 24, h - 24);
          break;

        case 'phantom':
          canvasCtx.strokeStyle = '#e2e8f0';
          canvasCtx.lineWidth = 3;
          canvasCtx.shadowColor = '#000000';
          canvasCtx.shadowBlur = 15;
          canvasCtx.strokeRect(14, 14, w - 28, h - 28);
          break;

        case 'superhero':
          canvasCtx.strokeStyle = '#38bdf8';
          canvasCtx.lineWidth = 3;
          canvasCtx.shadowColor = '#38bdf8';
          canvasCtx.shadowBlur = 14;
          canvasCtx.strokeRect(10, 10, w - 20, h - 20);
          break;

        case 'pixelate':
          canvasCtx.strokeStyle = '#a855f7';
          canvasCtx.lineWidth = 6;
          canvasCtx.strokeRect(8, 8, w - 16, h - 16);
          break;
      }

      canvasCtx.restore();
    }

    function drawIronManMask(eyeDist) {

      canvasCtx.save();

      // Outer Crimson Red Helmet
      const redGrad = canvasCtx.createLinearGradient(-mw / 2, -mh / 2, mw / 2, mh / 2);

      // Gold Faceplate (center plate)
      const goldGrad = canvasCtx.createLinearGradient(0, -mh * 0.4, 0, mh * 0.4);

      goldGrad.addColorStop(0.2, '#fbbf24');
      goldGrad.addColorStop(0.8, '#d97706');

      canvasCtx.fillStyle = goldGrad;

      canvasCtx.lineWidth = 2.5;
      canvasCtx.shadowColor = 'rgba(251, 191, 36, 0.3)';
      canvasCtx.shadowBlur = 10;

      canvasCtx.beginPath();
      canvasCtx.ellipse(0, mh * 0.02, mw * 0.32, mh * 0.44, 0, 0, Math.PI * 2);
      canvasCtx.fill();
      canvasCtx.stroke();

      // Panel Line / Mechanical Grooves
      canvasCtx.strokeStyle = '#78350f';
      canvasCtx.lineWidth = 1.5;
      // Forehead crest line
      canvasCtx.beginPath();
      canvasCtx.moveTo(0, -mh * 0.38);
      canvasCtx.lineTo(0, -mh * 0.15);
      canvasCtx.stroke();

      // Cheek accent lines
      canvasCtx.beginPath();
      canvasCtx.moveTo(-mw * 0.3, -mh * 0.05);

      canvasCtx.lineTo(mw * 0.1, mh * 0.1);
      canvasCtx.stroke();

      // Glowing Arc Eyes (Cyan/White) with pulse animation
      const nowSec = performance.now() / 1000;
      const ironPulse = 0.75 + 0.25 * Math.sin(nowSec * 5);
      canvasCtx.shadowColor = '#00f0ff';
      canvasCtx.shadowBlur = 12 + 14 * ironPulse;
      canvasCtx.fillStyle = '#e0f7fa';
      canvasCtx.strokeStyle = '#0284c7';
      canvasCtx.lineWidth = 2;

      // Left Eye
      canvasCtx.beginPath();
      canvasCtx.moveTo(-mw * 0.3, -mh * 0.1);
      canvasCtx.lineTo(-mw * 0.1, -mh * 0.06);
      canvasCtx.lineTo(-mw * 0.12, mh * 0.04);
      canvasCtx.lineTo(-mw * 0.27, -mh * 0.02);
      canvasCtx.closePath();
      canvasCtx.fill();
      canvasCtx.stroke();

      // Right Eye
      canvasCtx.beginPath();
      canvasCtx.moveTo(mw * 0.3, -mh * 0.1);
      canvasCtx.lineTo(mw * 0.1, -mh * 0.06);
      canvasCtx.lineTo(mw * 0.12, mh * 0.04);
      canvasCtx.lineTo(mw * 0.27, -mh * 0.02);
      canvasCtx.closePath();
      canvasCtx.fill();
      canvasCtx.stroke();

      // Eye White Inner Glow Core
      canvasCtx.fillStyle = '#ffffff';
      canvasCtx.beginPath();
      canvasCtx.moveTo(-mw * 0.28, -mh * 0.08);
      canvasCtx.lineTo(-mw * 0.12, -mh * 0.05);
      canvasCtx.lineTo(-mw * 0.14, mh * 0.02);
      canvasCtx.lineTo(-mw * 0.26, -mh * 0.02);
      canvasCtx.closePath();
      canvasCtx.fill();

      canvasCtx.beginPath();
      canvasCtx.moveTo(mw * 0.28, -mh * 0.08);
      canvasCtx.lineTo(mw * 0.12, -mh * 0.05);
      canvasCtx.lineTo(mw * 0.14, mh * 0.02);
      canvasCtx.lineTo(mw * 0.26, -mh * 0.02);
      canvasCtx.closePath();
      canvasCtx.fill();

      canvasCtx.restore();
    }

    function drawSpiderManMask(eyeDist, leftBlink = 1.0, rightBlink = 1.0) {
      const mw = eyeDist * 2.5;
      const mh = eyeDist * 1.7;

      canvasCtx.save();

      // Red Mask Cowl Base
      const redGrad = canvasCtx.createRadialGradient(0, 0, eyeDist * 0.2, 0, 0, mw * 0.6);
      redGrad.addColorStop(0, '#f87171');
      redGrad.addColorStop(0.4, '#ef4444');
      redGrad.addColorStop(0.8, '#dc2626');
      redGrad.addColorStop(1, '#991b1b');

      canvasCtx.fillStyle = redGrad;
      canvasCtx.strokeStyle = '#7f1d1d';
      canvasCtx.lineWidth = 3;
      canvasCtx.shadowColor = 'rgba(239, 68, 68, 0.4)';
      canvasCtx.shadowBlur = 15;

      // Red Mask Cowl Base (Ergonomic Facial Oval Silhouette)
      canvasCtx.beginPath();
      canvasCtx.ellipse(0, 0, mw * 0.48, mh * 0.52, 0, 0, Math.PI * 2);
      canvasCtx.fill();
      canvasCtx.stroke();

      // Spider Web Pattern
      canvasCtx.strokeStyle = 'rgba(20, 20, 20, 0.65)';
      canvasCtx.lineWidth = 1.8;

      const originX = 0;
      const originY = -mh * 0.05;
      const numRadials = 10;
      const radius = mw * 0.52;

      // Radial Lines
      for (let i = 0; i < numRadials; i++) {
        const angle = (i * Math.PI * 2) / numRadials;
        canvasCtx.beginPath();
        canvasCtx.moveTo(originX, originY);
        canvasCtx.lineTo(originX + Math.cos(angle) * radius, originY + Math.sin(angle) * radius);
        canvasCtx.stroke();
      }

      // Concentric Web Arcs
      const webRings = [eyeDist * 0.35, eyeDist * 0.7, eyeDist * 1.05];
      webRings.forEach(r => {
        canvasCtx.beginPath();
        for (let i = 0; i <= numRadials; i++) {
          const angle = (i * Math.PI * 2) / numRadials;
          const px = originX + Math.cos(angle) * r;
          const py = originY + Math.sin(angle) * r;

          const prevAngle = ((i - 0.5) * Math.PI * 2) / numRadials;
          const ctrlR = r * 0.85;
          const ctrlX = originX + Math.cos(prevAngle) * ctrlR;
          const ctrlY = originY + Math.sin(prevAngle) * ctrlR;

          if (i === 0) {
            canvasCtx.moveTo(px, py);
          } else {
            canvasCtx.quadraticCurveTo(ctrlX, ctrlY, px, py);
          }
        }
        canvasCtx.stroke();
      });

      // Iconic Animated Spider-Man Eye Lenses (Thick Black Border + White/Silver Mesh Lens)
      const drawLens = (isRight) => {
        const dir = isRight ? 1 : -1;
        const blinkFactor = Math.max(0.12, isRight ? rightBlink : leftBlink);

        canvasCtx.save();
        canvasCtx.translate(dir * eyeDist * 0.42, -mh * 0.02);
        // Vertical squish scaling for animated eye blink / expressiveness
        canvasCtx.scale(dir, blinkFactor);

        const lw = eyeDist * 0.42;
        const lh = eyeDist * 0.38;

        // Outer Black Frame
        canvasCtx.fillStyle = '#0f172a';
        canvasCtx.strokeStyle = '#000000';
        canvasCtx.lineWidth = 4;
        canvasCtx.shadowColor = '#000000';
        canvasCtx.shadowBlur = 10;

        canvasCtx.beginPath();
        canvasCtx.moveTo(-lw * 0.7, -lh * 0.5);
        canvasCtx.quadraticCurveTo(0, -lh * 0.8, lw * 0.75, -lh * 0.2);
        canvasCtx.quadraticCurveTo(lw * 0.4, lh * 0.7, -lw * 0.6, lh * 0.5);
        canvasCtx.quadraticCurveTo(-lw * 0.9, 0, -lw * 0.7, -lh * 0.5);
        canvasCtx.closePath();
        canvasCtx.fill();
        canvasCtx.stroke();

        // Inner White/Silver Lens
        const lensGrad = canvasCtx.createLinearGradient(-lw * 0.5, -lh * 0.5, lw * 0.5, lh * 0.5);
        lensGrad.addColorStop(0, '#ffffff');
        lensGrad.addColorStop(0.7, '#f1f5f9');
        lensGrad.addColorStop(1, '#cbd5e1');

        canvasCtx.fillStyle = lensGrad;
        canvasCtx.shadowColor = 'rgba(255, 255, 255, 0.8)';
        canvasCtx.shadowBlur = 8;

        canvasCtx.beginPath();
        canvasCtx.moveTo(-lw * 0.55, -lh * 0.38);
        canvasCtx.quadraticCurveTo(0, -lh * 0.62, lw * 0.58, -lh * 0.15);
        canvasCtx.quadraticCurveTo(lw * 0.28, lh * 0.5, -lw * 0.48, lh * 0.38);
        canvasCtx.quadraticCurveTo(-lw * 0.72, 0, -lw * 0.55, -lh * 0.38);
        canvasCtx.closePath();
        canvasCtx.fill();

        canvasCtx.restore();
      };

      drawLens(false); // Left Eye Lens
      drawLens(true);  // Right Eye Lens

      canvasCtx.restore();
    }

    function drawSuperheroMask(eyeDist) {
      const mw = eyeDist * 2.2;
      const mh = eyeDist * 0.95;

      canvasCtx.fillStyle = '#0f172a';
      canvasCtx.strokeStyle = '#38bdf8';
      canvasCtx.lineWidth = 3;
      canvasCtx.shadowColor = 'rgba(56, 189, 248, 0.5)';
      canvasCtx.shadowBlur = 12;

      canvasCtx.beginPath();
      canvasCtx.moveTo(-mw / 2, -mh * 0.2);
      canvasCtx.bezierCurveTo(-mw * 0.35, -mh * 0.8, mw * 0.35, -mh * 0.8, mw / 2, -mh * 0.2);
      canvasCtx.bezierCurveTo(mw * 0.55, mh * 0.5, mw * 0.2, mh * 0.9, 0, mh * 0.45);
      canvasCtx.bezierCurveTo(-mw * 0.2, mh * 0.9, -mw * 0.55, mh * 0.5, -mw / 2, -mh * 0.2);
      canvasCtx.closePath();
      canvasCtx.fill();
      canvasCtx.stroke();

      // Left Eye Slot
      canvasCtx.globalCompositeOperation = 'destination-out';
      canvasCtx.beginPath();
      canvasCtx.ellipse(-eyeDist * 0.45, 0, eyeDist * 0.25, eyeDist * 0.16, -0.2, 0, Math.PI * 2);
      canvasCtx.fill();

      // Right Eye Slot
      canvasCtx.beginPath();
      canvasCtx.ellipse(eyeDist * 0.45, 0, eyeDist * 0.25, eyeDist * 0.16, 0.2, 0, Math.PI * 2);
      canvasCtx.fill();

      canvasCtx.globalCompositeOperation = 'source-over';
    }

    function drawPrivacyCensorBar(eyeDist) {
      const bw = eyeDist * 2.5;
      const bh = eyeDist * 0.6;

      canvasCtx.fillStyle = '#000000';
      canvasCtx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      canvasCtx.shadowBlur = 10;

      canvasCtx.fillRect(-bw / 2, -bh / 2, bw, bh);

      canvasCtx.font = `bold ${Math.round(bh * 0.35)}px monospace`;
      canvasCtx.fillStyle = '#ef4444';
      canvasCtx.textAlign = 'center';
      canvasCtx.textBaseline = 'middle';
      canvasCtx.fillText('CENSORED', 0, 0);
    }

    function drawCyberVisor(eyeDist) {
      const vw = eyeDist * 2.4;
      const vh = eyeDist * 0.75;

      const grad = canvasCtx.createLinearGradient(-vw / 2, 0, vw / 2, 0);
      grad.addColorStop(0, '#06b6d4');
      grad.addColorStop(0.5, '#6366f1');
      grad.addColorStop(1, '#ec4899');

      canvasCtx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      canvasCtx.strokeStyle = grad;
      canvasCtx.lineWidth = 4;
      canvasCtx.shadowColor = '#06b6d4';
      canvasCtx.shadowBlur = 16;

      canvasCtx.beginPath();
      canvasCtx.moveTo(-vw / 2, -vh / 3);
      canvasCtx.lineTo(vw / 2, -vh / 3);
      canvasCtx.lineTo(vw * 0.4, vh / 2);
      canvasCtx.lineTo(-vw * 0.4, vh / 2);
      canvasCtx.closePath();
      canvasCtx.fill();
      canvasCtx.stroke();

      // Visor Glow Line
      canvasCtx.strokeStyle = '#ffffff';
      canvasCtx.lineWidth = 2;
      canvasCtx.beginPath();
      canvasCtx.moveTo(-vw * 0.42, 0);
      canvasCtx.lineTo(vw * 0.42, 0);
      canvasCtx.stroke();
    }

    function drawPixelatedAnonymizer(cx, cy, eyeDist) {
      const boxW = Math.round(eyeDist * 2.4);
      const boxH = Math.round(eyeDist * 1.1);
      const startX = Math.round(cx - boxW / 2);
      const startY = Math.round(cy - boxH / 2);

      const sampleSize = 12;
      for (let y = startY; y < startY + boxH; y += sampleSize) {
        for (let x = startX; x < startX + boxW; x += sampleSize) {
          canvasCtx.fillStyle = `hsl(${((x + y) * 3) % 360}, 70%, 50%)`;
          canvasCtx.fillRect(x - cx, y - cy, sampleSize - 1, sampleSize - 1);
        }
      }
    }

    function drawGoldVenetianLeaf(eyeDist) {
      const mw = eyeDist * 2.3;
      const mh = eyeDist * 1.1;

      const grad = canvasCtx.createLinearGradient(-mw / 2, -mh, mw / 2, mh);
      grad.addColorStop(0, '#f59e0b');
      grad.addColorStop(0.5, '#fbbf24');
      grad.addColorStop(1, '#d97706');

      canvasCtx.fillStyle = grad;
      canvasCtx.strokeStyle = '#fef08a';
      canvasCtx.lineWidth = 3;
      canvasCtx.shadowColor = '#f59e0b';
      canvasCtx.shadowBlur = 14;

      canvasCtx.beginPath();
      canvasCtx.moveTo(-mw / 2, -mh * 0.1);
      canvasCtx.quadraticCurveTo(-mw * 0.25, -mh * 0.9, 0, -mh * 0.6);
      canvasCtx.quadraticCurveTo(mw * 0.25, -mh * 0.9, mw / 2, -mh * 0.1);
      canvasCtx.quadraticCurveTo(mw * 0.35, mh * 0.7, 0, mh * 0.5);
      canvasCtx.quadraticCurveTo(-mw * 0.35, mh * 0.7, -mw / 2, -mh * 0.1);
      canvasCtx.closePath();
      canvasCtx.fill();
      canvasCtx.stroke();

      // Eye cutouts
      canvasCtx.globalCompositeOperation = 'destination-out';
      canvasCtx.beginPath();
      canvasCtx.ellipse(-eyeDist * 0.45, 0, eyeDist * 0.24, eyeDist * 0.15, 0, 0, Math.PI * 2);
      canvasCtx.fill();

      canvasCtx.beginPath();
      canvasCtx.ellipse(eyeDist * 0.45, 0, eyeDist * 0.24, eyeDist * 0.15, 0, 0, Math.PI * 2);
      canvasCtx.fill();

      canvasCtx.globalCompositeOperation = 'source-over';
    }

    function drawPhantomMask(eyeDist) {
      const mw = eyeDist * 1.5;
      const mh = eyeDist * 1.2;

      canvasCtx.fillStyle = '#f8fafc';
      canvasCtx.strokeStyle = '#cbd5e1';
      canvasCtx.lineWidth = 2;
      canvasCtx.shadowColor = 'rgba(0,0,0,0.5)';
      canvasCtx.shadowBlur = 10;

      canvasCtx.beginPath();
      canvasCtx.moveTo(0, -mh * 0.6);
      canvasCtx.quadraticCurveTo(mw * 0.6, -mh * 0.5, mw * 0.7, 0);
      canvasCtx.quadraticCurveTo(mw * 0.6, mh * 0.7, 0, mh * 0.5);
      canvasCtx.quadraticCurveTo(mw * 0.1, 0, 0, -mh * 0.6);
      canvasCtx.closePath();
      canvasCtx.fill();
      canvasCtx.stroke();

      // Eye cutout
      canvasCtx.globalCompositeOperation = 'destination-out';
      canvasCtx.beginPath();
      canvasCtx.ellipse(eyeDist * 0.38, -eyeDist * 0.05, eyeDist * 0.22, eyeDist * 0.14, 0.15, 0, Math.PI * 2);
      canvasCtx.fill();

      canvasCtx.globalCompositeOperation = 'source-over';
    }

    // Photo Capture Snapshot
    function takeSnapshot() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvasElement.width;
      tempCanvas.height = canvasElement.height;
      const ctx = tempCanvas.getContext('2d');

      // Draw mirrored video stream
      ctx.save();
      ctx.translate(tempCanvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(videoElement, 0, 0, tempCanvas.width, tempCanvas.height);
      ctx.restore();

      // Draw mask overlay
      ctx.save();
      ctx.translate(tempCanvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(canvasElement, 0, 0, tempCanvas.width, tempCanvas.height);
      ctx.restore();

      const dataUrl = tempCanvas.toDataURL('image/png');
      document.getElementById('snapshotImg').src = dataUrl;
      document.getElementById('downloadSnapshotBtn').href = dataUrl;
      document.getElementById('snapshotModal').classList.add('open');
    }

    function closeSnapshotModal() {
      document.getElementById('snapshotModal').classList.remove('open');
    }
  </script>
