<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Collage</title>
    <script src="files.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #3a3a3a 0%, #2a2a2a 50%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .collage-container {
            position: relative;
            width: 90vw;
            max-width: 1400px;
            height: 85vh;
            max-height: 900px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .collage-container::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(90deg, #5a5a5a, #4a4a4a, #3a3a3a, #2a2a2a, #1a1a1a, #2a2a2a, #5a5a5a);
            background-size: 400% 400%;
            border-radius: 22px;
            z-index: -1;
            animation: borderProgress 8s linear infinite;
        }

        @keyframes borderProgress {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 400% 50%;
            }
        }

        .collage-item {
            position: absolute;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease, border-radius 0.4s ease, top 0.6s ease, left 0.6s ease, right 0.6s ease, bottom 0.6s ease;
            cursor: pointer;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .collage-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .collage-item.shuffling {
            opacity: 0;
            transform: scale(0.8) rotate(0deg) !important;
        }

        .collage-item.dimmed {
            opacity: 0.15;
            filter: blur(2px);
        }

        .collage-item.focused {
            z-index: 1000;
            transform: rotate(0deg) !important;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 255, 255, 0.6);
            border-radius: 12px !important;
            position: fixed;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            transform: none !important;
            margin: 0;
            padding: 0;
        }

        .collage-item.exiting {
            opacity: 0 !important;
            transform: scale(0.5) !important;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease !important;
        }

        .collage-item.focused video {
            object-fit: contain;
            width: 100%;
            height: 100%;
        }

        .collage-item:hover:not(.focused) {
            transform: scale(1.08) !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            z-index: 50;
        }

        /* Item 1 - Large square, top left */
        .item-1 {
            width: 35%;
            height: 35%;
            top: 5%;
            left: 5%;
            border-radius: 15px;
            transform: rotate(-4deg);
        }

        /* Item 2 - Circle, top right */
        .item-2 {
            width: 28%;
            height: 28%;
            top: 3%;
            right: 8%;
            border-radius: 50%;
            transform: rotate(3deg);
        }

        /* Item 3 - Tall rectangle, middle left */
        .item-3 {
            width: 20%;
            height: 45%;
            top: 30%;
            left: 3%;
            border-radius: 10px;
            transform: rotate(2deg);
        }

        /* Item 4 - Wide rectangle, center */
        .item-4 {
            width: 40%;
            height: 25%;
            top: 40%;
            left: 30%;
            border-radius: 12px;
            transform: rotate(-3deg);
        }

        /* Item 5 - Small square, center right */
        .item-5 {
            width: 22%;
            height: 22%;
            top: 35%;
            right: 5%;
            border-radius: 8px;
            transform: rotate(5deg);
        }

        /* Item 6 - Circle, bottom left */
        .item-6 {
            width: 25%;
            height: 25%;
            bottom: 8%;
            left: 8%;
            border-radius: 50%;
            transform: rotate(-2deg);
        }

        /* Item 7 - Medium rectangle, bottom center */
        .item-7 {
            width: 30%;
            height: 20%;
            bottom: 5%;
            left: 35%;
            border-radius: 10px;
            transform: rotate(4deg);
        }

        /* Item 8 - Small circle, bottom right */
        .item-8 {
            width: 18%;
            height: 18%;
            bottom: 10%;
            right: 10%;
            border-radius: 50%;
            transform: rotate(-5deg);
        }


        .no-videos {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.5rem;
            text-align: center;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .collage-container {
                width: 95vw;
                height: 90vh;
            }

            .collage-item {
                transform: none !important;
            }

            .item-1 {
                width: 45%;
                height: 30%;
                top: 5%;
                left: 3%;
                border-radius: 12px;
            }
            .item-2 {
                width: 45%;
                height: 30%;
                top: 5%;
                right: 3%;
                border-radius: 50%;
            }
            .item-3 {
                width: 45%;
                height: 25%;
                top: 38%;
                left: 3%;
                border-radius: 10px;
            }
            .item-4 {
                width: 45%;
                height: 25%;
                top: 38%;
                right: 3%;
                border-radius: 12px;
            }
            .item-5 {
                width: 45%;
                height: 25%;
                top: 66%;
                left: 3%;
                border-radius: 8px;
            }
            .item-6 {
                width: 45%;
                height: 25%;
                top: 66%;
                right: 3%;
                border-radius: 50%;
            }
            .item-7 { display: none; }
            .item-8 { display: none; }

        }

        .close-button {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .close-button:hover {
            background: rgba(255, 0, 0, 0.7);
            border-color: rgba(255, 255, 255, 1);
        }

        .close-button.visible {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="collage-container">
        <div class="no-videos" id="noVideos">No videos found in videos folder</div>
    </div>
    <button class="close-button" id="closeButton">×</button>

    <script>
        // Pool of all available videos
        let videoPool = [];
        let currentVideos = [];
        let isShuffling = false;
        let scrollTimeout = null;
        let focusedItem = null;
        let originalPositions = new Map();
        let isPlaying = false;

        // Supported video formats
        const videoExtensions = ['.mp4', '.webm', '.ogg', '.mov', '.avi', '.mkv'];

        // Try to detect additional video files via API
        async function detectAdditionalFiles() {
            try {
                const response = await fetch('/api/files?folder=videos');
                if (response.ok) {
                    const files = await response.json();
                    const newFiles = files.filter(filePath => !videoPool.includes(filePath));
                    if (newFiles.length > 0) {
                        videoPool = [...videoPool, ...newFiles];
                        console.log(`[API] Detected ${newFiles.length} additional video files`);
                    }
                }
            } catch (e) {
                console.log('Could not fetch via API, relying on files.js fallback');
            }
        }

        // Shuffle array using Fisher-Yates algorithm
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Get new set of videos for the collage
        function getNewVideoSet() {
            if (videoPool.length === 0) {
                return [];
            }
            if (videoPool.length >= 8) {
                const shuffled = shuffleArray(videoPool);
                return shuffled.slice(0, 8);
            } else {
                return shuffleArray(videoPool);
            }
        }

        // Update visible frames based on available content
        function updateVisibleFrames() {
            const items = document.querySelectorAll('.collage-item');
            const availableCount = videoPool.length;
            
            if (availableCount === 0) {
                items.forEach(item => {
                    item.style.display = 'none';
                });
                const noVideos = document.getElementById('noVideos');
                if (noVideos) {
                    noVideos.textContent = 'Add content to videos folder';
                    noVideos.style.display = 'block';
                }
                return;
            }
            
            const noVideos = document.getElementById('noVideos');
            if (noVideos) {
                noVideos.style.display = 'none';
            }
            
            items.forEach((item, index) => {
                if (index < availableCount) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Render video items
        function renderVideos() {
            const container = document.querySelector('.collage-container');
            const noVideos = document.getElementById('noVideos');
            
            if (videoPool.length === 0) {
                noVideos.style.display = 'block';
                return;
            }
            
            noVideos.style.display = 'none';
            
            // Clear existing video items
            const existingItems = container.querySelectorAll('.collage-item');
            existingItems.forEach(item => item.remove());
            
            currentVideos = getNewVideoSet();
            
            const itemClasses = ['item-1', 'item-2', 'item-3', 'item-4', 'item-5', 'item-6', 'item-7', 'item-8'];
            
            currentVideos.forEach((videoSrc, index) => {
                if (index < itemClasses.length) {
                    const item = document.createElement('div');
                    item.className = `collage-item ${itemClasses[index]}`;
                    
                    const video = document.createElement('video');
                    video.src = videoSrc;
                    video.preload = 'metadata';
                    video.muted = true;
                    video.loop = false;
                    video.playsInline = true;
                    
                    video.addEventListener('ended', () => {
                        exitFocused();
                    });
                    
                    item.appendChild(video);
                    container.appendChild(item);
                }
            });
            
            // Store original positions
            originalPositions.clear();
            document.querySelectorAll('.collage-item').forEach(item => {
                const computedStyle = window.getComputedStyle(item);
                originalPositions.set(item, {
                    top: item.style.top || computedStyle.top,
                    left: item.style.left || computedStyle.left,
                    right: item.style.right || computedStyle.right,
                    bottom: item.style.bottom || computedStyle.bottom
                });
            });
            
            // Add click handlers
            addClickHandlers();
        }

        // Add click handlers for play/pause and focus
        function addClickHandlers() {
            document.querySelectorAll('.collage-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const video = item.querySelector('video');
                    
                    if (focusedItem === item) {
                        if (video.paused) {
                            video.play();
                            video.muted = false;
                            isPlaying = true;
                        } else {
                            video.pause();
                            isPlaying = false;
                        }
                    } else {
                        if (focusedItem) {
                            const prevVideo = focusedItem.querySelector('video');
                            if (prevVideo) {
                                prevVideo.pause();
                                prevVideo.currentTime = 0;
                                prevVideo.muted = true;
                            }
                            focusedItem.classList.remove('focused');
                        }
                        
                        focusItem(item);
                        
                        video.muted = false;
                        video.play();
                        isPlaying = true;
                    }
                });
            });

            document.querySelector('.collage-container').addEventListener('click', () => {
                exitFocused();
            });
            
            document.getElementById('closeButton').addEventListener('click', (e) => {
                e.stopPropagation();
                exitFocused();
            });
        }

        function exitFocused() {
            if (!focusedItem) return;
            const item = focusedItem;
            item.classList.add('exiting');
            document.getElementById('closeButton').classList.remove('visible');
            setTimeout(() => {
                resetFocus();
                item.classList.remove('exiting');
            }, 600);
        }

        function focusItem(item) {
            document.querySelectorAll('.collage-item').forEach(i => {
                if (i !== item) {
                    i.classList.add('dimmed');
                    applyMagneticRepulsion(i);
                    const video = i.querySelector('video');
                    if (video) {
                        video.pause();
                        video.muted = true;
                    }
                }
            });
            
            item.classList.remove('dimmed');
            item.classList.add('focused');
            focusedItem = item;
            
            document.getElementById('closeButton').classList.add('visible');
        }

        function resetFocus() {
            document.querySelectorAll('.collage-item').forEach(i => {
                i.classList.remove('dimmed');
                i.classList.remove('focused');
                restoreOriginalPosition(i);
                const video = i.querySelector('video');
                if (video) {
                    video.pause();
                    video.currentTime = 0;
                    video.muted = true;
                }
            });
            focusedItem = null;
            isPlaying = false;
            
            document.getElementById('closeButton').classList.remove('visible');
        }

        function applyMagneticRepulsion(item) {
            const container = document.querySelector('.collage-container');
            const containerRect = container.getBoundingClientRect();
            const itemRect = item.getBoundingClientRect();
            
            const centerX = containerRect.width / 2;
            const centerY = containerRect.height / 2;
            
            const itemCenterX = itemRect.left - containerRect.left + itemRect.width / 2;
            const itemCenterY = itemRect.top - containerRect.top + itemRect.height / 2;
            
            const deltaX = itemCenterX - centerX;
            const deltaY = itemCenterY - centerY;
            
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const repulsionStrength = 80;
            
            if (distance > 0) {
                const pushX = (deltaX / distance) * repulsionStrength;
                const pushY = (deltaY / distance) * repulsionStrength;
                
                const originalPos = originalPositions.get(item);
                
                if (originalPos.right && originalPos.right !== 'auto') {
                    item.style.right = `calc(${originalPos.right} + ${pushX}px)`;
                } else if (originalPos.left) {
                    item.style.left = `calc(${originalPos.left} + ${pushX}px)`;
                }
                
                if (originalPos.bottom && originalPos.bottom !== 'auto') {
                    item.style.bottom = `calc(${originalPos.bottom} + ${pushY}px)`;
                } else if (originalPos.top) {
                    item.style.top = `calc(${originalPos.top} + ${pushY}px)`;
                }
            }
        }

        function restoreOriginalPosition(item) {
            const originalPos = originalPositions.get(item);
            if (originalPos) {
                item.style.top = originalPos.top;
                item.style.left = originalPos.left;
                item.style.right = originalPos.right;
                item.style.bottom = originalPos.bottom;
            }
        }

        // Update videos with animation
        function shuffleVideos() {
            if (isShuffling) return;
            isShuffling = true;

            const items = document.querySelectorAll('.collage-item');
            const newVideos = getNewVideoSet();
            
            const visibleItems = Array.from(items).filter(item => item.style.display !== 'none');
            
            const wasPlaying = isPlaying;

            visibleItems.forEach(item => {
                const video = item.querySelector('video');
                if (video) {
                    video.pause();
                    video.muted = true;
                }
                item.classList.add('shuffling');
            });

            setTimeout(() => {
                visibleItems.forEach((item, index) => {
                    const video = item.querySelector('video');
                    if (video && newVideos[index]) {
                        video.src = newVideos[index];
                        video.load();
                    }
                });

                visibleItems.forEach((item, index) => {
                    setTimeout(() => {
                        item.classList.remove('shuffling');
                    }, index * 50);
                });

                currentVideos = newVideos;
                isShuffling = false;
                
                if (wasPlaying && focusedItem) {
                    const video = focusedItem.querySelector('video');
                    if (video) {
                        video.muted = false;
                        video.play();
                    }
                }
            }, 400);
        }

        // Handle mouse wheel scroll
        let scrollDelta = 0;
        const scrollThreshold = 100;

        document.addEventListener('wheel', (e) => {
            e.preventDefault();
            scrollDelta += Math.abs(e.deltaY);

            if (scrollDelta >= scrollThreshold && !isShuffling && videoPool.length > 0) {
                shuffleVideos();
                scrollDelta = 0;
            }
        }, { passive: false });

        // Async Initialization
        async function init() {
            // 1. Try static list from files.js
            if (window.collageFiles && window.collageFiles.videos) {
                videoPool = [...window.collageFiles.videos];
            }

            // 2. Try API detection
            await detectAdditionalFiles();

            // 3. Fallback to repository defaults if empty
            if (videoPool.length === 0) {
                videoPool = [
                    'videos/tumblr_0a3f03f882b557143357653b5d740a64_55f2d1d4_720.mp4'
                ];
            }

            // Setup frames layout and render videos
            updateVisibleFrames();
            renderVideos();
        }

        // Run initialization
        window.addEventListener('DOMContentLoaded', init);

        // Handle Left/Right arrow key navigation
        document.addEventListener('keydown', (e) => {
            if (videoPool.length === 0) return;
            
            if (e.key === 'ArrowLeft') {
                if (focusedItem) {
                    navigateFocused(-1);
                } else {
                    shuffleVideos();
                }
            } else if (e.key === 'ArrowRight') {
                if (focusedItem) {
                    navigateFocused(1);
                } else {
                    shuffleVideos();
                }
            }
        });

        function navigateFocused(direction) {
            const items = Array.from(document.querySelectorAll('.collage-item'));
            const visibleItems = items.filter(item => item.style.display !== 'none');
            if (visibleItems.length <= 1) return;
            
            let currentIndex = visibleItems.indexOf(focusedItem);
            if (currentIndex === -1) return;
            
            let nextIndex = (currentIndex + direction + visibleItems.length) % visibleItems.length;
            const nextItem = visibleItems[nextIndex];
            
            resetFocus();
            focusItem(nextItem);
            
            const video = nextItem.querySelector('video');
            if (video) {
                video.muted = false;
                video.play();
                isPlaying = true;
            }
        }
    </script>
</body>
</html>
