<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Video Gallery</title>
    <script src="config.js"></script>
    <script src="files.js" onerror="console.warn('files.js not found. Using fallback files.')"></script>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(15, 15, 15, 0.85);
            --panel-border: rgba(255, 215, 0, 0.2);
            --accent-color: #ffd700;
            --accent-glow: rgba(255, 215, 0, 0.5);
            --text-color: #f0f0f0;
            --text-muted: rgba(240, 240, 240, 0.5);
            --btn-bg: rgba(255, 215, 0, 0.05);
            --btn-hover: rgba(255, 215, 0, 0.2);
        }

        body.theme-matrix {
            --accent-color: #00ff00;
            --accent-glow: rgba(0, 255, 0, 0.6);
            --btn-bg: rgba(0, 255, 0, 0.08);
            --btn-hover: rgba(0, 255, 0, 0.25);
            --panel-border: rgba(0, 255, 0, 0.3);
        }

        body.theme-cyber {
            --accent-color: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.5);
            --btn-bg: rgba(0, 229, 255, 0.08);
            --btn-hover: rgba(0, 229, 255, 0.25);
            --panel-border: rgba(0, 229, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            overflow: hidden;
            padding: 15px;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
            text-transform: uppercase;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 15px;
            flex-grow: 1;
            height: calc(100vh - 95px);
        }

        @media (max-width: 992px) {
            .dashboard-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
                height: auto;
                overflow-y: auto;
            }
        }

        .grid-viewport-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .vid-grid {
            display: grid;
            gap: 15px;
            width: 100%;
            height: 100%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .vid-grid.layout-2x2 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
        .vid-grid.layout-3x3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
        .vid-grid.layout-4x4 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
        .vid-grid.layout-hero {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }
        .vid-grid.layout-hero .vid-monitor:nth-child(1) { grid-column: span 2; grid-row: span 2; }

        .vid-monitor {
            position: relative;
            background: #000;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .vid-monitor video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
        }

        .vid-monitor:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
            z-index: 5;
        }

        .vid-monitor.focused {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            z-index: 2000 !important;
            border: none; border-radius: 0; margin: 0;
            cursor: default;
            background: rgba(0,0,0,0.95);
        }
        .vid-monitor.focused video {
            object-fit: contain;
        }

        .control-sidebar {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .control-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }
        .control-section:last-child { border-bottom: none; }

        .control-section h2 {
            font-size: 0.85rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-group.full { grid-template-columns: 1fr; }

        .control-btn {
            background: var(--btn-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .control-btn:hover {
            background: var(--btn-hover);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .control-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .close-button {
            position: fixed;
            top: 25px; right: 35px;
            width: 45px; height: 45px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            color: var(--accent-color);
            font-size: 24px;
            cursor: pointer;
            z-index: 2500;
            display: none;
            align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .close-button:hover { background: var(--accent-color); color: #000; }
        .close-button.visible { display: flex; }

        /* Custom Styles for Frames */
        .style-cinema .vid-monitor {
            border: 1px solid #111;
            padding-top: 10px;
            padding-bottom: 10px;
            background: #000;
        }
        
        .style-crt .vid-monitor video {
            filter: contrast(1.2) sepia(0.2) hue-rotate(-10deg);
        }
        .style-crt .vid-monitor::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .vid-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 15px 10px 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: white;
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
        }
        .vid-monitor:hover .vid-overlay { opacity: 1; }
        .vid-monitor.focused .vid-overlay { display: none; }

    </style>
</head>
<body>

    <button class="close-button" id="closeButton" title="Exit Full Screen (ESC)">&times;</button>

    <header>
        <h1>Dynamic Video Gallery</h1>
        <div style="font-size: 0.9rem; color: var(--text-muted);" id="counter">0 Videos Loaded</div>
    </header>

    <div class="dashboard-container">
        
        <div class="grid-viewport-card">
            <div class="vid-grid layout-3x3" id="vid-grid">
                <!-- populated dynamically -->
            </div>
        </div>

        <div class="control-sidebar">
            
            <div class="control-section">
                <h2>Grid Layout</h2>
                <div class="btn-group">
                    <button class="control-btn" data-layout="2x2">2x2 Grid</button>
                    <button class="control-btn active" data-layout="3x3">3x3 Grid</button>
                    <button class="control-btn" data-layout="4x4">4x4 Grid</button>
                    <button class="control-btn" data-layout="hero">Hero Split</button>
                </div>
            </div>

            <div class="control-section">
                <h2>Theme Colors</h2>
                <div class="btn-group">
                    <button class="control-btn active" data-theme="gold">Gold</button>
                    <button class="control-btn" data-theme="matrix">Matrix</button>
                    <button class="control-btn" data-theme="cyber">Cyber</button>
                </div>
            </div>

            <div class="control-section">
                <h2>Display Style</h2>
                <div class="btn-group">
                    <button class="control-btn active" data-style="modern">Modern</button>
                    <button class="control-btn" data-style="cinema">Cinematic</button>
                    <button class="control-btn" data-style="crt">CRT Filter</button>
                </div>
            </div>

            <div class="control-section">
                <h2>Playback Controls</h2>
                <div class="btn-group full">
                    <button class="control-btn active" id="play-btn">PLAY / PAUSE (ALL)</button>
                    <button class="control-btn" id="shuffle-btn">Shuffle Videos</button>
                </div>
            </div>

            <div class="control-section" style="flex-grow: 1;">
                <h2>Shortcuts Reference</h2>
                <div style="font-size: 0.75rem; color: var(--text-muted); line-height: 1.8; margin-top: 10px;">
                    [Click] View video fullscreen<br>
                    [ESC] Exit Fullscreen mode<br>
                    [Space] Play/Pause all<br>
                    [Scroll] Shuffle active feeds
                </div>
            </div>

        </div>
    </div>

    <script>
        const PATH_KEY = 'bindsol_path_videoViewer';
        const defaultPath = (window.BindsolConfig && window.BindsolConfig.apps && window.BindsolConfig.apps.videoViewer)
            ? `${window.BindsolConfig.apps.videoViewer.parent}/${window.BindsolConfig.apps.videoViewer.folder}`
            : 'input/videos';

        function getSavedPath() {
            return localStorage.getItem(PATH_KEY) || defaultPath;
        }

        let videoPool = [];
        const currentPath = getSavedPath();
        const currentFolderKey = currentPath.split('/').pop();
        
        if (window.collageFiles && Array.isArray(window.collageFiles[currentFolderKey]) && window.collageFiles[currentFolderKey].length > 0) {
            videoPool = window.collageFiles[currentFolderKey];
        } else if (window.collageFiles && Array.isArray(window.collageFiles['videos']) && window.collageFiles['videos'].length > 0) {
            videoPool = window.collageFiles['videos'];
        }

        async function fetchVideosDynamic() {
            const pathVal = getSavedPath();
            try {
                const res = await fetch(`/api/files/scan?path=${encodeURIComponent(pathVal)}`);
                if (res.ok) {
                    const files = await res.json();
                    if (files && files.length > 0) {
                        videoPool = files;
                        buildGrid();
                        return;
                    }
                }
            } catch (e) {}
        }

        let activeLayout = '3x3';
        let focusedItem = null;
        let isPlaying = true;
        const grid = document.getElementById('vid-grid');
        const closeBtn = document.getElementById('closeButton');
        let currentVideos = [];

        function getLayoutCount(layout) {
            if(layout === '2x2') return 4;
            if(layout === '3x3') return 9;
            if(layout === '4x4') return 16;
            if(layout === 'hero') return 6;
            return 9;
        }

        function shuffleArray(array) {
            const temp = [...array];
            for (let i = temp.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [temp[i], temp[j]] = [temp[j], temp[i]];
            }
            return temp;
        }

        function buildGrid() {
            grid.innerHTML = '';
            const count = getLayoutCount(activeLayout);
            currentVideos = shuffleArray(videoPool).slice(0, count);

            currentVideos.forEach((src, i) => {
                const box = document.createElement('div');
                box.className = 'vid-monitor';
                
                const vid = document.createElement('video');
                vid.src = src;
                vid.autoplay = isPlaying;
                vid.loop = true;
                vid.muted = true;
                vid.playsInline = true;
                vid.disablePictureInPicture = true;
                vid.disableRemotePlayback = true;
                
                const overlay = document.createElement('div');
                overlay.className = 'vid-overlay';
                overlay.innerHTML = `<span>Feed ${String(i+1).padStart(2, '0')}</span><span class="res">LIVE</span>`;

                vid.onloadedmetadata = () => {
                    const resSpan = overlay.querySelector('.res');
                    if(resSpan) resSpan.innerText = `${vid.videoWidth}x${vid.videoHeight}`;
                };

                box.appendChild(vid);
                box.appendChild(overlay);

                box.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if(focusedItem === box) {
                        closeFullscreen();
                    } else {
                        if(focusedItem) closeFullscreen();
                        box.classList.add('focused');
                        focusedItem = box;
                        vid.muted = false; // Unmute on focus
                        vid.play(); // ensure playing when focused
                        closeBtn.classList.add('visible');
                    }
                });

                grid.appendChild(box);
            });

            document.getElementById('counter').innerText = `${videoPool.length} Videos Available`;
        }

        function closeFullscreen() {
            if(focusedItem) {
                const vid = focusedItem.querySelector('video');
                if(vid) vid.muted = true;
                focusedItem.classList.remove('focused');
                focusedItem = null;
                closeBtn.classList.remove('visible');
            }
        }

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeFullscreen();
        });

        document.getElementById('play-btn').addEventListener('click', togglePlay);

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
            document.querySelectorAll('video').forEach(v => {
                if(isPlaying) v.play();
                else v.pause();
            });
        }

        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape') closeFullscreen();
            if(e.key === ' ' && !focusedItem) { e.preventDefault(); togglePlay(); }
        });

        let scrollDelta = 0;
        document.addEventListener('wheel', (e) => {
            if(focusedItem) return;
            scrollDelta += Math.abs(e.deltaY);
            if(scrollDelta > 150) {
                buildGrid();
                scrollDelta = 0;
            }
        });

        // Layout Buttons
        document.querySelectorAll('[data-layout]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('[data-layout]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeLayout = btn.dataset.layout;
                grid.className = `vid-grid layout-${activeLayout}`;
                buildGrid();
            });
        });

        // Theme Buttons
        document.querySelectorAll('[data-theme]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-theme]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.body.className = '';
                if(btn.dataset.theme !== 'gold') {
                    document.body.classList.add(`theme-${btn.dataset.theme}`);
                }
            });
        });

        // Style Buttons
        document.querySelectorAll('[data-style]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-style]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                grid.parentElement.className = 'grid-viewport-card';
                if(btn.dataset.style !== 'modern') {
                    grid.parentElement.classList.add(`style-${btn.dataset.style}`);
                }
            });
        });

        document.getElementById('shuffle-btn').addEventListener('click', buildGrid);

        // Init
        buildGrid();
        fetchVideosDynamic();
        setInterval(fetchVideosDynamic, 10000);
    </script>
</body>
</html>
